<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Khayt logo preview</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 24px; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p { color: #aaa; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 24px; }
    .card { background: #1a1f28; border: 1px solid #333; border-radius: 12px; padding: 16px; text-align: center; }
    .card img { max-width: 100%; height: auto; border-radius: 8px; }
    .card.light { background: #f5edd9; }
    .label { font-size: 12px; color: #888; margin-top: 8px; }
    code { background: #222; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Khayt logo preview</h1>
  <p>Open this file in a browser: <code>assets/logo/preview.html</code><br>
  Regenerate with <code>npm run build:icons</code></p>
  <div class="grid">
    <div class="card">
      <img src="icon-preview.png" width="256" height="256" alt="App icon 1024 downscaled">
      <div class="label">App icon (1024px master)</div>
    </div>
    <div class="card">
      <img src="mark-128.png" width="128" height="128" alt="Sidebar mark">
      <div class="label">Sidebar mark (128px)</div>
    </div>
    <div class="card">
      <img src="mark-64.png" width="64" height="64" alt="Sidebar mark 64">
      <div class="label">Sidebar mark (64px)</div>
    </div>
    <div class="card light">
      <img src="mark-128.png" width="128" height="128" alt="Mark on light bg">
      <div class="label" style="color:#666">Mark on light background</div>
    </div>
  </div>
</body>
</html>
