<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="filament" x1="16" y1="4" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9ef2ff"/>
      <stop offset="1" stop-color="#2BCDE4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Nuqta (diamond dot of .) -->
  <path d="M16 5.2 17.4 6.6 16 8 14.6 6.6Z" fill="url(#filament)" filter="url(#glow)"/>
  <!-- Three parallel filament strokes forming Kha (.) -->
  <g stroke="url(#filament)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M20.2 10.2 C19.4 9.1 17.8 8.8 16.6 9.6 C15.2 10.6 14.8 12.2 15.6 13.6 C16.8 15.8 16.2 18.6 14.2 20.2 C12.6 21.4 10.4 21.2 9.2 19.6" stroke-width="1.35"/>
    <path d="M21.1 11.1 C20.2 9.8 18.4 9.4 17.1 10.3 C15.5 11.4 15 13.2 15.9 14.8 C17.3 17.2 16.6 20.3 14.4 22 C12.6 23.4 10.1 23.1 8.7 21.2" stroke-width="1.35"/>
    <path d="M22 12 C21 10.5 19 10 17.6 11 C15.8 12.2 15.2 14.2 16.2 16 C17.8 18.6 17 21.9 14.6 23.8 C12.6 25.4 9.8 25 8.2 22.8" stroke-width="1.35"/>
  </g>
  <!-- Extrusion base line -->
  <line x1="13" y1="24.5" x2="19" y2="24.5" stroke="#2BCDE4" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
</svg>
