name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── macOS arm64 (Apple Silicon) ────────────────────────────────
  build-mac-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS arm64 DMG
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: build/*.dmg

  # ── macOS x64 (Intel) ──────────────────────────────────────────
  build-mac-x64:
    name: macOS (Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS x64 DMG
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          path: build/*.dmg

  # ── Windows x64 ────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/*.exe

  # ── Linux x64 ──────────────────────────────────────────────────
  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev \
            libgtk-3-dev libdrm-dev libgbm-dev libfuse2 rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage + deb
        run: npx electron-builder --linux --x64 --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/*.AppImage
            build/*.deb

  # ── Publish GitHub Release ─────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-mac-arm64, build-mac-x64, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List release files
        run: ls -lah release-files/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Khayt ${{ github.ref_name }}
          draft: false
          # Mark as pre-release automatically for beta/rc/alpha tags
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') }}
          # Only mark as latest for stable releases
          make_latest: ${{ !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-alpha') }}
          fail_on_unmatched_files: false
          body: |
            ## Khayt ${{ github.ref_name }}

            3D printing production management for macOS, Windows, and Linux.

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS Apple Silicon | `Khayt-*-arm64.dmg` |
            | macOS Intel | `Khayt-*-x64.dmg` |
            | Windows installer | `Khayt-*-Setup.exe` |
            | Windows portable | `Khayt-*-portable.exe` |
            | Linux AppImage | `Khayt-*.AppImage` |
            | Linux Debian/Ubuntu | `Khayt-*.deb` |

            ### First launch
            - **macOS**: Right-click → Open if blocked by Gatekeeper
            - **Windows**: Click "More info" → "Run anyway" on SmartScreen
            - **Linux AppImage**: `chmod +x Khayt-*.AppImage` then run
            - **Linux deb**: `sudo dpkg -i Khayt-*.deb`
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
