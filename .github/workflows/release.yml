name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── macOS arm64 (Apple Silicon) ────────────────────────────────
  build-mac-arm64:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64 DMG
        run: npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: build/*.dmg

  # ── macOS x64 (Intel) ──────────────────────────────────────────
  build-mac-x64:
    name: macOS x64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build x64 DMG
        run: npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          path: build/*.dmg

  # ── Windows x64 ────────────────────────────────────────────────
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure git credentials
        run: git config --global url."https://${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert PNG icon to ICO
        shell: pwsh
        run: |
          magick assets/icon_preview.png -resize 256x256 assets/icon.ico
          Write-Host "Icon created at assets/icon.ico"

      - name: Build Windows installer + portable
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/*.exe

  # ── Linux x64 ──────────────────────────────────────────────────
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libgtk-3-dev \
            libdrm-dev \
            libgbm-dev \
            fakeroot \
            dpkg \
            libfuse2

      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build AppImage + deb
        run: npx electron-builder --linux --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/*.AppImage
            build/*.deb

  # ── Publish GitHub Release ─────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-mac-arm64, build-mac-x64, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List release files
        run: ls -lah release-files/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Khayt ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## Khayt ${{ github.ref_name }}

            3D printing production management — free & open source.

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS | Apple Silicon (M1/M2/M3) | `Khayt-*-arm64.dmg` |
            | macOS | Intel | `Khayt-*-x64.dmg` |
            | Windows | 64-bit installer | `Khayt-*-Setup.exe` |
            | Windows | 64-bit portable | `Khayt-*-portable.exe` |
            | Linux | AppImage (universal) | `Khayt-*.AppImage` |
            | Linux | Debian / Ubuntu (.deb) | `Khayt-*.deb` |

            ### Installation notes
            - **macOS**: Right-click the DMG → Open to bypass the unsigned-app warning
            - **Windows**: If SmartScreen appears, click "More info" → "Run anyway"
            - **Linux AppImage**: Run `chmod +x Khayt-*.AppImage` then double-click
            - **Linux deb**: `sudo dpkg -i Khayt-*.deb`
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
