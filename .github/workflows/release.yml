name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS Universal (Apple Silicon + Intel in one DMG) ─────────
  build-mac:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Universal DMG
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: build/*.dmg

  # ── Windows x64 ────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/*.exe

  # ── Linux x64 ──────────────────────────────────────────────────
  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev \
            libgtk-3-dev libdrm-dev libgbm-dev libfuse2 rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage + deb
        run: npx electron-builder --linux --x64 --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/*.AppImage
            build/*.deb

  # ── Publish GitHub Release ─────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List release files
        run: ls -lah release-files/

      - name: Publish release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          IS_PRE=$(echo "$TAG" | grep -qE '\-(beta|rc|alpha)' && echo true || echo false)

          # Get or create release
          RELEASE=$(curl -sf "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            -H "Authorization: token $GH_TOKEN" || echo "")

          if [ -z "$RELEASE" ]; then
            echo "Creating release for $TAG..."
            RELEASE=$(curl -sf -X POST "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"Khayt $TAG\",\"draft\":false,\"prerelease\":$IS_PRE,\"body\":\"See [README](https://github.com/$GITHUB_REPOSITORY#readme) for full release notes.\"}")
          else
            echo "Found existing release, will upload assets to it..."
            # Ensure it is published (not draft)
            RELEASE_ID=$(echo "$RELEASE" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
            curl -sf -X PATCH "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"draft\":false,\"prerelease\":$IS_PRE}" > /dev/null
          fi

          RELEASE_ID=$(echo "$RELEASE" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          UPLOAD_URL="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets"

          echo "Release ID: $RELEASE_ID — uploading assets..."
          for f in release-files/*; do
            NAME=$(basename "$f")
            # Delete existing asset with same name if present
            ASSET_ID=$(curl -sf "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              -H "Authorization: token $GH_TOKEN" \
              | python3 -c "import json,sys,os; assets=json.load(sys.stdin); a=next((a for a in assets if a['name']==os.environ['NAME']),None); print(a['id'] if a else '')" NAME="$NAME")
            if [ -n "$ASSET_ID" ]; then
              echo "  Replacing $NAME (existing asset $ASSET_ID)..."
              curl -sf -X DELETE "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
                -H "Authorization: token $GH_TOKEN" > /dev/null
            fi
            echo "  Uploading $NAME..."
            curl -sf -X POST "$UPLOAD_URL?name=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$NAME")" \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" > /dev/null
            echo "  ✅ $NAME"
          done
          echo "🎉 Release $TAG published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
