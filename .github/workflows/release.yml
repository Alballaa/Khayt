name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS Universal (Apple Silicon + Intel in one DMG) ─────────
  build-mac:
    name: macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Universal DMG
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: build/*.dmg

  # ── Windows x64 ────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS installer
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/*.exe

  # ── Linux x64 ──────────────────────────────────────────────────
  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev \
            libgtk-3-dev libdrm-dev libgbm-dev libfuse2 rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage + deb
        run: npx electron-builder --linux --x64 --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/*.AppImage
            build/*.deb

  # ── Publish GitHub Release ─────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List release files
        run: ls -lah release-files/

      - name: Publish release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e

          # Determine pre-release flag
          if echo "$TAG" | grep -qE '\-(beta|rc|alpha)'; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi

          NOTES="See [README](https://github.com/${GITHUB_REPOSITORY}#readme) for full release notes."

          # Create release if it doesn't exist; otherwise ensure it's published
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — ensuring it is published..."
            gh release edit "$TAG" --draft=false $PRERELEASE_FLAG --repo "$GITHUB_REPOSITORY" || true
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "Khayt $TAG" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG \
              --repo "$GITHUB_REPOSITORY"
          fi

          # Upload all assets; --clobber replaces any already-uploaded file with the same name
          echo "Uploading assets..."
          gh release upload "$TAG" release-files/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

          echo "🎉 Release $TAG published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
