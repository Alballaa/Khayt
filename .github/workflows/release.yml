name: Build & Release

on:
  push:
    tags:
      # Khayt's own line, and the only tag lane. `v*` does NOT match `bedready-v*`
      # — the glob anchors at the start — which is what kept the two apart while
      # Bed Ready still had a tag trigger.
      - 'v*'
  # Bed Ready is a separate flavor of this repo on an independent version line
  # (1.0.0-*, see scripts/build-bedready.mjs) whose downloads live in
  # KhaytApp/bedready. It used to be triggered by pushing a `bedready-v*` tag HERE,
  # and that tag was the problem: electron-updater picks a release by walking this
  # repo's releases.atom, and that feed lists TAGS, whether or not a release exists
  # for them. A `bedready-v*` tag therefore appeared in Khayt's own update feed, and
  # whenever it was the newest entry a Khayt user with beta updates on resolved it,
  # then asked for
  #   /KhaytApp/Khayt/releases/download/bedready-v1.0.0/latest-mac.yml
  # which is a 404, because that release lives in the other repo. Their update check
  # simply failed. Cutting Bed Ready 1.0 would have opened exactly that window and
  # held it until Khayt's next tag.
  #
  # So Bed Ready is dispatched instead of tagged. Nothing is pushed to this repo's
  # tag namespace; the release tag is still created, but by `gh release create` in
  # KhaytApp/bedready, where it belongs.
  workflow_dispatch:
    inputs:
      bedready_version:
        description: 'Bed Ready version to release, e.g. 1.0.0 or 1.0.0-beta.10 (no "v")'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Create the GitHub Release first so parallel build jobs can publish to it ─
  create-release:
    name: Create GitHub Release
    # Tag pushes only: a workflow_dispatch is Bed Ready's, and its ref_name is a
    # branch, which the old `!startsWith(ref_name,'bedready-')` test would have let through.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.flags.outputs.prerelease }}
    steps:
      - name: Detect pre-release
        id: flags
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '\-(beta|rc|alpha)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.flags.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Khayt $TAG" \
            --notes "See [README](https://github.com/${GITHUB_REPOSITORY}#readme) for full release notes." \
            --draft \
            $FLAGS \
            2>/dev/null || echo "Release already exists — continuing"

  # ── macOS Apple Silicon DMG ───────────────────────────────────────────────
  #
  # The three build jobs and `publish` all need `create-release`, and a job whose
  # dependency was skipped is skipped too. That one `if:` above is therefore what
  # keeps this entire Khayt lane off a Bed Ready run — do not add
  # `if: always()` to anything below without restoring the guard explicitly.
  # (`publish` now does exactly that, and says so.)

  # macOS is OPT-IN, because it is the expensive one: GitHub bills macOS minutes
  # at 10x, so one mac build costs more than the Windows and Linux builds and the
  # whole CI run for the release PR put together. Betas go out every few days;
  # they do not all need a mac binary.
  #
  # To include macOS in the next tag:
  #     gh variable set BUILD_MAC --repo KhaytApp/Khayt --body true
  #     …push the tag…
  #     gh variable delete BUILD_MAC --repo KhaytApp/Khayt
  #
  # The variable is deliberately sticky rather than per-tag: there is one
  # workflow_dispatch on this file and it belongs to Bed Ready, and bending it to
  # take a second, unrelated meaning is how that lane got tangled the last time.
  # Leaving it set costs money silently, so `carry-mac-manifest` below prints the
  # current state on every release either way.
  build-mac:
    name: macOS (Apple Silicon)
    needs: create-release
    if: ${{ vars.BUILD_MAC == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish macOS Apple Silicon DMG
        run: npx electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK:                    ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD:            ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}

  # ── Windows x64 (NSIS installer + portable + MSIX for Store) ──────────────
  build-windows:
    name: Windows (x64)
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish Windows installers
        # Only nsis + portable are published to GitHub Releases.
        run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_IDENTITY_AUTO_DISCOVERY: false
          # ── Windows code signing (uncomment when HARICA cert is ready) ───────
          # WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}         # base64 .pfx
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Add Windows SDK makeAppx to PATH
        # electron-builder needs makeAppx.exe; find the latest installed SDK version
        shell: pwsh
        run: |
          $kitsBase = "C:\Program Files (x86)\Windows Kits\10\bin"
          if (Test-Path $kitsBase) {
            $latest = Get-ChildItem $kitsBase -Directory |
                      Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                      Sort-Object Name -Descending |
                      Select-Object -First 1
            if ($latest) {
              $sdkBin = Join-Path $latest.FullName "x64"
              Write-Host "Adding SDK bin to PATH: $sdkBin"
              Add-Content $env:GITHUB_PATH $sdkBin
            } else {
              Write-Warning "No versioned SDK folder found under $kitsBase"
            }
          } else {
            Write-Warning "Windows Kits directory not found — skipping PATH addition"
          }

      - name: Build MSIX for Microsoft Store
        # Unsigned — Partner Center signs it during certification.
        id: build-appx
        continue-on-error: true
        run: npx electron-builder --win appx --x64 --publish never
        env:
          WIN_CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: Debug — dump generated AppxManifest.xml
        if: always()
        shell: pwsh
        run: |
          $manifest = "build\__appx-x64\AppxManifest.xml"
          if (Test-Path $manifest) {
            Write-Host "=== AppxManifest.xml ==="
            Get-Content $manifest
          } else {
            Write-Host "Manifest not found at expected path. Searching..."
            Get-ChildItem build -Recurse -Filter "AppxManifest.xml" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName }
          }

      - name: Fail job if appx build failed
        if: steps.build-appx.outcome == 'failure'
        run: exit 1

      - name: Upload MSIX as workflow artifact
        if: steps.build-appx.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: windows-store-msix
          path: build/*.appx
          retention-days: 30

  # ── Keep macOS auto-update working on a release with no mac build ─────────
  #
  # electron-updater picks a release by walking this repo's releases.atom and
  # then fetches the manifest for its own platform. A release with no
  # latest-mac.yml therefore 404s for every macOS user with beta updates on, and
  # lib/updater.js turns that into a visible "Update check failed" — the exact
  # failure the bedready-v* tag caused, documented at the top of this file.
  #
  # So when macOS is skipped, copy the manifest forward from the last release
  # that HAS one. macOS users then resolve to the newest version a mac binary
  # actually exists for, and are told they are up to date rather than shown an
  # error. That is true: there is no newer mac build.
  carry-mac-manifest:
    name: macOS manifest (carried forward)
    needs: create-release
    if: ${{ github.event_name == 'push' && vars.BUILD_MAC != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Copy latest-mac.yml from the most recent release that has one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "BUILD_MAC is not 'true' — macOS was skipped for $TAG (macOS bills at 10x)."
          prev=""
          for r in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName --jq '.[].tagName' | grep -v "^${TAG}$"); do
            if gh release view "$r" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'latest-mac.yml'; then
              prev="$r"; break
            fi
          done
          if [ -z "$prev" ]; then
            echo "No earlier release carries latest-mac.yml — nothing to carry forward."
            echo "macOS users have no build to update to either way, so this is not a regression."
            exit 0
          fi
          echo "Carrying latest-mac.yml forward from $prev"
          gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern latest-mac.yml --dir .
          gh release upload "$TAG" latest-mac.yml --repo "$GITHUB_REPOSITORY" --clobber
          echo "macOS updaters resolve to $prev and report 'up to date'."

  # ── Linux x64 (AppImage + deb) ────────────────────────────────────────────
  build-linux:
    name: Linux (x64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev \
            libgtk-3-dev libdrm-dev libgbm-dev rpm
          # libfuse2 was renamed libfuse2t64 on Ubuntu 24.04 (ubuntu-latest)
          sudo apt-get install -y libfuse2t64 2>/dev/null || \
          sudo apt-get install -y libfuse2 2>/dev/null || \
          echo "FUSE2 not available — AppImage will use extraction fallback"

      - name: Install dependencies
        run: npm ci

      # `--publish always`, like macOS and Windows above — NOT `never`.
      #
      # Every Linux release from v3.2.0 to v3.4.0 shipped without the
      # `latest-linux.yml` update feed, so the update check the app runs on every
      # platform asked for a manifest that was not there. Nothing failed loudly;
      # Linux users were quietly stranded on whatever they first installed.
      #
      # The cause was the UPLOAD, not the build. `--publish never` still WRITES
      # the manifest — it only skips uploading — and the step below globbed
      # `*.AppImage` and `*.deb`, so the file was generated on every run and left
      # behind on the runner. Proof: Bed Ready builds with `--publish never`
      # (scripts/build-bedready.mjs) and its releases carry latest-linux.yml.
      #
      # `always` is used anyway rather than widening the glob, because it makes
      # all three platforms work the same way and puts the manifest and the
      # binaries it describes on the release in one step, from the one process
      # that computed their hashes.
      - name: Build & publish Linux AppImage + deb
        run: npx electron-builder --linux --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            build/*.AppImage
            build/*.deb

  # ── Publish: upload Linux artifacts + mark release public ─────────────────
  publish:
    name: Publish Release
    needs: [create-release, build-mac, build-windows, build-linux, carry-mac-manifest]
    # `publish` is what removes the draft flag, so if it is skipped the release
    # never becomes visible. A job whose dependency was SKIPPED is skipped too —
    # the trap named at the top of this file — and build-mac is now skipped on
    # every release that does not opt into macOS. Without this condition,
    # switching macOS off would have silently left every release a permanent
    # draft.
    #
    # `always()` is required to run at all once a dependency can be skipped, and
    # the comment above build-mac says never to add it without restoring the Bed
    # Ready guard explicitly. That guard is the create-release line below: it is
    # skipped on a workflow_dispatch, so requiring it to have SUCCEEDED keeps this
    # whole lane off a Bed Ready run exactly as `needs:` alone used to.
    #
    # mac may be 'success' or 'skipped'; it may not be 'failure'. A mac build that
    # was asked for and broke must not publish a release missing its binary.
    if: >-
      ${{ always()
      && needs.create-release.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.build-linux.result == 'success'
      && (needs.build-mac.result == 'success' || needs.build-mac.result == 'skipped')
      && (needs.carry-mac-manifest.result == 'success' || needs.carry-mac-manifest.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: linux-files

      # electron-builder now uploads the Linux artifacts itself (see
      # `--publish always` above), so this is a belt-and-braces re-upload rather
      # than the only path. `--clobber` makes it idempotent, and it keeps the
      # release complete if a direct upload is ever dropped.
      #
      # It deliberately does NOT re-upload the update manifest: electron-builder
      # is the only thing that computes latest-linux.yml's hashes and sizes, and
      # a stale copy from a previous run overwriting a fresh one would point
      # every Linux client at the wrong bytes.
      - name: Upload Linux artifacts to release (backstop)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(linux-files/*.AppImage linux-files/*.deb)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no Linux installers were built"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.create-release.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release edit "$TAG" \
            --draft=false \
            $FLAGS \
            --repo "$GITHUB_REPOSITORY"
          echo "✅ Release $TAG published"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # Tell the website straight away rather than waiting on its hourly cron.
      #
      # This used to live in notify-website.yml, listening for `release:
      # published`. It never fired once — not for v3.2.0 nor any of the 61 betas
      # — for two independent reasons: the release above is created as a draft
      # (drafts emit no release event at all), and the publish is done with
      # GITHUB_TOKEN, whose events deliberately do not cascade into other
      # workflows. Dispatching from here removes both, because it runs in the
      # same job that just published.
      #
      # Never fails the release: the artifacts are already live at this point,
      # and the website's own hourly schedule is the backstop.
      - name: Notify website
        continue-on-error: true
        env:
          SYNC_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::WEBSITE_SYNC_TOKEN is not set — skipping the instant site sync."
            echo "The site will still pick this release up via its hourly schedule."
            echo "To make it instant, add a repo secret WEBSITE_SYNC_TOKEN with a PAT"
            echo "that has contents:write on the khayt-website repository."
            exit 0
          fi
          # One dispatch, one repo. This used to loop over KhaytApp/khayt-website
          # and Alballaa/khayt-website as though they were two sites; they are the
          # same repository (id 1246893244) — the Alballaa path is a leftover
          # transfer redirect. Dispatching both would start two concurrent
          # sync-release runs that race to push, and the loser dies on
          # `! [rejected] main -> main (fetch first)`.
          REPO=KhaytApp/khayt-website
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/dispatches" \
            -d "{\"event_type\":\"khayt-release\",\"client_payload\":{\"tag\":\"$TAG\"}}")
          if [ "$CODE" = "204" ]; then
            echo "✅ $REPO notified for $TAG"
          else
            echo "::warning::$REPO dispatch returned HTTP $CODE (hourly sync will cover it)"
          fi

  # ══ Bed Ready ═══════════════════════════════════════════════════════════════
  #
  # Same repo, same commit, different flavor: its own appId, icon, output dir and
  # an independent 1.0.0-* version line (scripts/build-bedready.mjs), with
  # downloads in the public KhaytApp/bedready repo.
  #
  # Two things about this lane are deliberate and easy to "fix" wrongly:
  #
  # 1. `--publish never`, then upload with `gh`. electron-builder's GitHub
  #    publisher derives its tag from the package version (`v${version}`), which
  #    here would be `v1.0.0-beta.8` — NOT the `bedready-v*` tag this workflow
  #    creates in KhaytApp/bedready, and not what the releases already in that repo
  #    use. Letting it publish would quietly start a second tag convention in the
  #    same repo. `never` still WRITES the update manifests; it only skips upload.
  #
  # 2. The uploads therefore MUST include latest*.yml and the .blockmaps, not
  #    just the installers. Globbing only installers is exactly what stranded
  #    Linux users on v3.2.0–v3.4.0 (see the Khayt Linux job above). Each
  #    platform emits its own manifest — latest-mac.yml / latest.yml /
  #    latest-linux.yml — so the three jobs never overwrite each other's.
  bedready-release:
    name: Bed Ready — create release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      # The release tag, created in KhaytApp/bedready by `gh release create` and
      # nowhere in this repo. Downstream jobs take it from here rather than from
      # github.ref_name, which is now a branch.
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Require a cross-repo token
        env:
          TOKEN: ${{ secrets.BEDREADY_RELEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::BEDREADY_RELEASE_TOKEN is not set."
            echo "Bed Ready publishes to KhaytApp/bedready, a DIFFERENT repository."
            echo "The automatic GITHUB_TOKEN is scoped to this repo only and cannot"
            echo "create a release there. Add a repo secret BEDREADY_RELEASE_TOKEN"
            echo "holding a PAT with contents:write on KhaytApp/bedready."
            exit 1
          fi

      - name: Derive version
        id: v
        env:
          VERSION_IN: ${{ inputs.bedready_version }}
        run: |
          # Tolerate a leading v or the old bedready-v prefix, so muscle memory
          # from the tag days does not fail a release for a cosmetic reason.
          VERSION="${VERSION_IN#bedready-}"
          VERSION="${VERSION#v}"
          # Checked against a real version shape rather than "something non-empty":
          # a typo would otherwise sail through and fail much later, inside
          # electron-builder, with a far worse message.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION_IN' is not a version of the form X.Y.Z[-beta.N]"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=bedready-v$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -qE '\-(beta|rc|alpha)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Bed Ready $VERSION"

      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.BEDREADY_RELEASE_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release create "$TAG" \
            --repo KhaytApp/bedready \
            --title "Bed Ready $VERSION" \
            --notes "Built from KhaytApp/Khayt@${GITHUB_SHA}. See the Khayt CHANGELOG for what changed." \
            --draft \
            $FLAGS \
            2>/dev/null || echo "Release already exists — continuing"

  bedready-mac:
    name: Bed Ready — macOS (Apple Silicon)
    needs: bedready-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Build Bed Ready (mac arm64)
        run: node scripts/build-bedready.mjs --mac --arm64 --publish never
        env:
          BEDREADY_VERSION: ${{ needs.bedready-release.outputs.version }}
          CSC_LINK:                    ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD:            ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts + update feed
        env:
          GH_TOKEN: ${{ secrets.BEDREADY_RELEASE_TOKEN }}
          TAG: ${{ needs.bedready-release.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(build-bedready/*.dmg build-bedready/*-mac-*.zip \
                 build-bedready/*.blockmap build-bedready/latest-mac.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no macOS artifacts were produced"; exit 1
          fi
          if [ ! -f build-bedready/latest-mac.yml ]; then
            echo "::error::latest-mac.yml is missing — the app could not auto-update"; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo KhaytApp/bedready

  bedready-windows:
    name: Bed Ready — Windows (x64)
    needs: bedready-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Build Bed Ready (win x64)
        run: node scripts/build-bedready.mjs --win --x64 --publish never
        env:
          BEDREADY_VERSION: ${{ needs.bedready-release.outputs.version }}

      - name: Upload Windows artifacts + update feed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BEDREADY_RELEASE_TOKEN }}
          TAG: ${{ needs.bedready-release.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(build-bedready/*.exe build-bedready/*.blockmap build-bedready/latest.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no Windows artifacts were produced"; exit 1
          fi
          if [ ! -f build-bedready/latest.yml ]; then
            echo "::error::latest.yml is missing — the app could not auto-update"; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo KhaytApp/bedready

  bedready-linux:
    name: Bed Ready — Linux (x64)
    needs: bedready-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev \
            libgtk-3-dev libdrm-dev libgbm-dev rpm
          sudo apt-get install -y libfuse2t64 2>/dev/null || \
          sudo apt-get install -y libfuse2 2>/dev/null || \
          echo "FUSE2 not available — AppImage will use extraction fallback"

      - name: Install dependencies
        run: npm ci

      - name: Build Bed Ready (linux x64)
        run: node scripts/build-bedready.mjs --linux --x64 --publish never
        env:
          BEDREADY_VERSION: ${{ needs.bedready-release.outputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Linux artifacts + update feed
        env:
          GH_TOKEN: ${{ secrets.BEDREADY_RELEASE_TOKEN }}
          TAG: ${{ needs.bedready-release.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(build-bedready/*.AppImage build-bedready/*.deb build-bedready/latest-linux.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no Linux artifacts were produced"; exit 1
          fi
          if [ ! -f build-bedready/latest-linux.yml ]; then
            echo "::error::latest-linux.yml is missing — the app could not auto-update"; exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo KhaytApp/bedready

  bedready-publish:
    name: Bed Ready — publish
    needs: [bedready-release, bedready-mac, bedready-windows, bedready-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.BEDREADY_RELEASE_TOKEN }}
          TAG: ${{ needs.bedready-release.outputs.tag }}
          PRERELEASE: ${{ needs.bedready-release.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release edit "$TAG" --draft=false $FLAGS --repo KhaytApp/bedready
          echo "✅ Bed Ready $TAG published"
          echo "https://github.com/KhaytApp/bedready/releases/tag/$TAG"
