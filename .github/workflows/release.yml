name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Create the GitHub Release first so parallel build jobs can publish to it ─
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.flags.outputs.prerelease }}
    steps:
      - name: Detect pre-release
        id: flags
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '\-(beta|rc|alpha)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.flags.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Khayt $TAG" \
            --notes "See [README](https://github.com/${GITHUB_REPOSITORY}#readme) for full release notes." \
            --draft \
            $FLAGS \
            2>/dev/null || echo "Release already exists — continuing"

  # ── macOS Apple Silicon DMG ───────────────────────────────────────────────
  build-mac:
    name: macOS (Apple Silicon)
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish macOS Apple Silicon DMG
        run: npx electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK:                    ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD:            ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID:                    ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}

  # ── Windows x64 (NSIS installer + portable + MSIX for Store) ──────────────
  build-windows:
    name: Windows (x64)
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish Windows installers
        # Only nsis + portable are published to GitHub Releases.
        run: npx electron-builder --win nsis portable --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_IDENTITY_AUTO_DISCOVERY: false
          # ── Windows code signing (uncomment when HARICA cert is ready) ───────
          # WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}         # base64 .pfx
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Add Windows SDK makeAppx to PATH
        # electron-builder needs makeAppx.exe; find the latest installed SDK version
        shell: pwsh
        run: |
          $kitsBase = "C:\Program Files (x86)\Windows Kits\10\bin"
          if (Test-Path $kitsBase) {
            $latest = Get-ChildItem $kitsBase -Directory |
                      Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                      Sort-Object Name -Descending |
                      Select-Object -First 1
            if ($latest) {
              $sdkBin = Join-Path $latest.FullName "x64"
              Write-Host "Adding SDK bin to PATH: $sdkBin"
              Add-Content $env:GITHUB_PATH $sdkBin
            } else {
              Write-Warning "No versioned SDK folder found under $kitsBase"
            }
          } else {
            Write-Warning "Windows Kits directory not found — skipping PATH addition"
          }

      - name: Build MSIX for Microsoft Store
        # Unsigned — Partner Center signs it during certification.
        id: build-appx
        continue-on-error: true
        run: npx electron-builder --win appx --x64 --publish never
        env:
          WIN_CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: Debug — dump generated AppxManifest.xml
        if: always()
        shell: pwsh
        run: |
          $manifest = "build\__appx-x64\AppxManifest.xml"
          if (Test-Path $manifest) {
            Write-Host "=== AppxManifest.xml ==="
            Get-Content $manifest
          } else {
            Write-Host "Manifest not found at expected path. Searching..."
            Get-ChildItem build -Recurse -Filter "AppxManifest.xml" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName }
          }

      - name: Fail job if appx build failed
        if: steps.build-appx.outcome == 'failure'
        run: exit 1

      - name: Upload MSIX as workflow artifact
        if: steps.build-appx.outcome == 'success'
        uses: actions/upload-artifact@v5
        with:
          name: windows-store-msix
          path: build/*.appx
          retention-days: 30

  # ── Linux x64 (AppImage + deb) ────────────────────────────────────────────
  build-linux:
    name: Linux (x64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev \
            libgtk-3-dev libdrm-dev libgbm-dev rpm
          # libfuse2 was renamed libfuse2t64 on Ubuntu 24.04 (ubuntu-latest)
          sudo apt-get install -y libfuse2t64 2>/dev/null || \
          sudo apt-get install -y libfuse2 2>/dev/null || \
          echo "FUSE2 not available — AppImage will use extraction fallback"

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage + deb
        run: npx electron-builder --linux --x64 --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v5
        with:
          name: linux-x64
          path: |
            build/*.AppImage
            build/*.deb

  # ── Publish: upload Linux artifacts + mark release public ─────────────────
  publish:
    name: Publish Release
    needs: [create-release, build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: linux-x64
          path: linux-files

      - name: Upload Linux artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" linux-files/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.create-release.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release edit "$TAG" \
            --draft=false \
            $FLAGS \
            --repo "$GITHUB_REPOSITORY"
          echo "✅ Release $TAG published"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # Tell the website straight away rather than waiting on its hourly cron.
      #
      # This used to live in notify-website.yml, listening for `release:
      # published`. It never fired once — not for v3.2.0 nor any of the 61 betas
      # — for two independent reasons: the release above is created as a draft
      # (drafts emit no release event at all), and the publish is done with
      # GITHUB_TOKEN, whose events deliberately do not cascade into other
      # workflows. Dispatching from here removes both, because it runs in the
      # same job that just published.
      #
      # Never fails the release: the artifacts are already live at this point,
      # and the website's own hourly schedule is the backstop.
      - name: Notify website
        continue-on-error: true
        env:
          SYNC_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::WEBSITE_SYNC_TOKEN is not set — skipping the instant site sync."
            echo "The site will still pick this release up via its hourly schedule."
            echo "To make it instant, add a repo secret WEBSITE_SYNC_TOKEN with a PAT"
            echo "that has contents:write on the khayt-website repositories."
            exit 0
          fi
          for REPO in KhaytApp/khayt-website Alballaa/khayt-website; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $SYNC_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/dispatches" \
              -d "{\"event_type\":\"khayt-release\",\"client_payload\":{\"tag\":\"$TAG\"}}")
            if [ "$CODE" = "204" ]; then
              echo "✅ $REPO notified for $TAG"
            else
              echo "::warning::$REPO dispatch returned HTTP $CODE (hourly sync will cover it)"
            fi
          done
