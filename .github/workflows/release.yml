name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Create the GitHub Release first so parallel build jobs can publish to it ─
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.flags.outputs.prerelease }}
    steps:
      - name: Detect pre-release
        id: flags
        run: |
          if echo "${{ github.ref_name }}" | grep -qE '\-(beta|rc|alpha)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.flags.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Khayt $TAG" \
            --notes "See [README](https://github.com/${GITHUB_REPOSITORY}#readme) for full release notes." \
            --draft \
            $FLAGS \
            2>/dev/null || echo "Release already exists — continuing"

  # ── macOS Universal DMG ────────────────────────────────────────────────────
  build-mac:
    name: macOS (Universal)
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish macOS Universal DMG
        run: npx electron-builder --mac --universal --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Apple code signing (uncomment when Developer ID cert is ready) ──
          # CSC_LINK:                    ${{ secrets.APPLE_CSC_LINK }}
          # CSC_KEY_PASSWORD:            ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          # APPLE_ID:                    ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # remove this line once signing is configured

  # ── Windows x64 (NSIS installer + portable + MSIX for Store) ──────────────
  build-windows:
    name: Windows (x64)
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish Windows installers
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ── Windows code signing (uncomment when HARICA cert is ready) ───────
          # WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}         # base64 .pfx
          # WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

  # ── Linux x64 (AppImage + deb) ────────────────────────────────────────────
  build-linux:
    name: Linux (x64)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-dev libatk-bridge2.0-dev \
            libgtk-3-dev libdrm-dev libgbm-dev libfuse2 rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage + deb
        run: npx electron-builder --linux --x64 --publish never
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/*.AppImage
            build/*.deb

  # ── Publish: upload Linux artifacts + mark release public ─────────────────
  publish:
    name: Publish Release
    needs: [create-release, build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: linux-files

      - name: Upload Linux artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" linux-files/* \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Publish release (remove draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.create-release.outputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release edit "$TAG" \
            --draft=false \
            $FLAGS \
            --repo "$GITHUB_REPOSITORY"
          echo "✅ Release $TAG published"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
