# Cut a release tag from the GitHub UI or the API, rather than from a laptop.
#
# ── Why this exists ─────────────────────────────────────────────────────────
# Every Khayt tag so far was created by a maintainer on their own machine, and
# `release.yml` fires on `push: tags: v*`. That works, but it means the release
# is gated on one person having a checkout in front of them — and it means an
# agent session, or anyone without push rights to `refs/tags/*`, can land the
# version bump and then not finish the job. That is exactly what happened on
# 2026-08-23: `3.7.0-beta.4` was merged to `main` and the tag was never pushed,
# so `package.json` claimed a release that did not exist and the newest build a
# beta user could get was `beta.3`.
#
# ── What it does NOT do ─────────────────────────────────────────────────────
# It does not build or publish anything, and it does not touch `release.yml`.
# All it does is create the tag, after checking the things a human would check.
# `release.yml` then runs unchanged, on the same trigger it always has. Keeping
# the proven release path untouched is the point: this is a new front door, not
# a second implementation.
#
# ── The trap this design exists to avoid ────────────────────────────────────
# A tag pushed with the default `GITHUB_TOKEN` does NOT trigger other workflows.
# GitHub suppresses it deliberately, to stop workflows triggering each other in
# a loop. So the obvious version of this file — tag with `GITHUB_TOKEN`, let
# `release.yml` pick it up — creates the tag and then silently builds nothing,
# with this job green. There is no error anywhere; you find out when someone
# asks where the installers are.
#
# Hence `RELEASE_TAG_TOKEN`: a Personal Access Token (or GitHub App token) with
# `contents: write` on this repo. A tag pushed with a non-default credential
# triggers `release.yml` normally. The preflight step below refuses to run
# without it rather than producing that silent no-op.
name: Cut release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag, exactly as package.json spells it, with no leading v (e.g. 3.7.0-beta.4)'
        required: true
        type: string
      commit:
        description: 'Commit to tag. Blank = the tip of the default branch. Must be on the default branch either way.'
        required: false
        type: string

# The PAT below does the write. GITHUB_TOKEN needs nothing beyond reading the
# repo, and is deliberately not given more.
permissions:
  contents: read

jobs:
  cut:
    name: Verify, then tag
    runs-on: ubuntu-latest
    steps:
      # Checked before the checkout, so a missing secret costs one step and
      # names its own fix, instead of failing later inside a git push whose
      # error is about credentials rather than about configuration.
      - name: Preflight — the token this whole file depends on
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          if [ -z "$RELEASE_TAG_TOKEN" ]; then
            echo "::error::RELEASE_TAG_TOKEN is not set, so this workflow cannot do its job."
            echo
            echo "It needs a PAT or GitHub App token with contents:write on this repo,"
            echo "stored as the repository secret RELEASE_TAG_TOKEN."
            echo
            echo "It cannot fall back to GITHUB_TOKEN: a tag pushed with the default"
            echo "token does not trigger release.yml, so the tag would be created and"
            echo "NOTHING would be built — with this job green and no error anywhere."
            echo "Failing here is the honest outcome."
            exit 1
          fi
          echo "RELEASE_TAG_TOKEN is present."

      # persist-credentials (the default) leaves the PAT configured as the
      # remote's credential, so the push at the end is a plain `git push` and the
      # token is never handled in a shell script where it could be echoed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TAG_TOKEN }}

      - name: Resolve the commit to tag
        id: resolve
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --quiet
          if [ -n "$INPUT_COMMIT" ]; then
            SHA=$(git rev-parse --verify "${INPUT_COMMIT}^{commit}")
          else
            SHA=$(git rev-parse --verify "origin/${DEFAULT_BRANCH}^{commit}")
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Tagging $SHA"
          git --no-pager log -1 --format='%h %s' "$SHA"

      # A commit off the default branch has not been through the required
      # checks — `main` is protected by a ruleset with strict status checks, so
      # "is an ancestor of main" IS the statement "CI passed on this", and a
      # second check-run query here would only restate it less reliably.
      - name: The commit must be on the default branch
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::$SHA is not an ancestor of $DEFAULT_BRANCH."
            echo "Releases are cut from the default branch, which is the only ref whose"
            echo "required checks are enforced. Merge it first."
            exit 1
          fi
          echo "$SHA is on $DEFAULT_BRANCH."

      # The check that would have caught the 2026-08-23 mess in the other
      # direction: tagging a commit whose package.json says something else
      # produces a release whose installers report a version nobody asked for,
      # and an update feed that disagrees with itself.
      - name: package.json at that commit must say exactly this version
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FOUND=$(git show "$SHA:package.json" | jq -r .version)
          if [ "$FOUND" != "$VERSION" ]; then
            echo "::error::package.json at $SHA is '$FOUND', not '$VERSION'."
            echo "Tag the commit that carries the bump — usually the release PR's merge"
            echo "commit, NOT the tip, if anything landed on top of it."
            exit 1
          fi
          echo "package.json at $SHA is $FOUND."

      # A release with no notes is a release nobody can read. CI already refuses
      # a PR that ships code without a CHANGELOG entry; this refuses a TAG whose
      # version was never moved out of [Unreleased] into a section of its own.
      - name: CHANGELOG must have a section for this version
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! git show "$SHA:CHANGELOG.md" | grep -qF "## [$VERSION]"; then
            echo "::error::CHANGELOG.md at $SHA has no '## [$VERSION]' section."
            echo "Move the notes out of [Unreleased] into a section for this version first."
            exit 1
          fi
          echo "CHANGELOG.md has a section for $VERSION."

      # release.yml refuses to re-run against a PUBLISHED release, and is right
      # to. Catching it here turns that late, cryptic failure into an early one
      # that says which tag and why.
      - name: The tag must not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists on the remote."
            echo "A version that is already out cannot be re-cut — re-running the release"
            echo "would split its artifacts across two releases and leave the live one with"
            echo "manifests that no longer match its binaries. Cut a NEW version instead."
            exit 1
          fi
          echo "$TAG is free."

      - name: Create and push the tag
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # Annotated, to match every tag on this repo's history: an annotated
          # tag carries who cut it and when, which a lightweight one does not.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "$TAG"
          echo "Pushed $TAG at $SHA."

      - name: Say what happens next
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ steps.resolve.outputs.sha }}
          BUILD_MAC: ${{ vars.BUILD_MAC }}
        run: |
          {
            echo "### Tagged \`v$VERSION\`"
            echo
            echo "At commit \`$SHA\`. **Build & Release** is now running on the tag push —"
            echo "this job does not build anything itself."
            echo
            if [ "$BUILD_MAC" = "true" ]; then
              echo "- \`BUILD_MAC\` is **true**: macOS will be built. It bills at 10x."
              echo "  Unset it after this release — it is sticky."
            else
              echo "- \`BUILD_MAC\` is not set: **Windows + Linux only**."
              echo "  \`carry-mac-manifest\` copies \`latest-mac.yml\` forward so mac update"
              echo "  checks keep resolving. To include macOS, set the repository variable"
              echo "  BUILD_MAC=true and cut a new version — it cannot be added to this one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
