name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a PR's previous run when a new commit arrives. Without this, every
# force-push (a rebase to clear BEHIND, which `main` being strict makes routine)
# left the superseded run going to completion — paying full price for an answer
# about code that no longer exists. Keyed per ref, so runs on different PRs never
# cancel each other.
#
# `main` is deliberately excluded via the ref in the group name: a push to main is
# the run that gates the next release, and two of those in quick succession must
# both finish rather than the first being cancelled by the second.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A change a shop can notice should say so in CHANGELOG.md. Nine PRs landed
  # between v3.6.0-beta.8 and this job with [Unreleased] empty for all of them,
  # so those release notes were written at cut time by someone who had not made
  # the changes. PRs only — a push to main is a squash of something already checked.
  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The default shallow clone has no base ref to diff against.
          fetch-depth: 0

      - name: Changelog entry for shipped changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-changelog.js

  # CONTRIBUTING.md says a PR without a DCO sign-off can't be merged. Until this
  # job that was not true of anything except the sentence. PRs only, for the same
  # reason as the changelog job: a push to main is a squash of something already
  # checked, and the squash commit is written by GitHub, not by the author.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs the base ref present to enumerate the PR's own commits.
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node scripts/check-dco.js

  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run lint

      # A renderer global whose file is never loaded fails SILENTLY — the feature
      # is simply absent. Three instances in a week (#578, #581, #587), none of
      # which errored. Khayt's entry point only for now; bedready.html has known
      # violations that belong to the session that owns that flavour.
      - name: Renderer globals are actually loaded
        run: npm run check:globals

      # The Store listing is copy in a JSON file, so it breaks like copy — one
      # long feature bullet over 200 characters and the whole submission is
      # rejected. Checking it on every PR means that surfaces in review, not in
      # a certification queue on release day.
      - name: Microsoft Store listing is within limits
        run: npm run store:check

      # ROADMAP, VERSIONING, BETA-RELEASE and RELEASE-HOLD each claim which
      # release is current, in prose, in four places. On 2026-08-27 they claimed
      # four different things at once — one of them contradicting itself inside a
      # single section — and every one was found by a human re-reading the files
      # at cut time. This asks only that the repo agree with itself; whether the
      # tag was really pushed is a question for `gh release list`, not for CI.
      - name: Release docs agree on which release is current
        run: npm run check:release-claims

      - name: Unit tests
        run: npm test

      # CI runs in UTC, which is the one timezone where a UTC-derived calendar
      # day happens to be correct — so a whole class of bug was invisible here.
      # A quote stayed approvable after expiry, an order taken at 01:00 local was
      # dated yesterday into revenue-by-day, and a monthly expense walked
      # backwards a day every cycle. Run the suite where the two calendars
      # disagree.
      #
      # The far edge runs on EVERY event, the two nearer offsets only on a push to
      # main. Running the whole suite four times per pull request was the single
      # largest line in the Actions bill, and +14 is where a UTC-derived date is
      # most wrong: any calculation that takes "today" from UTC is off by a full
      # day there, so it fails at Kiritimati before it fails at Riyadh or Los
      # Angeles. Keeping it on PRs preserves the signal that found these bugs;
      # the other two still gate every merge, because main is what a release is
      # tagged from.
      - name: Unit tests (Pacific/Kiritimati, UTC+14 — the far edge)
        run: TZ=Pacific/Kiritimati npm test

      - name: Unit tests (Asia/Riyadh, UTC+3 — the primary market)
        if: github.event_name == 'push'
        run: TZ=Asia/Riyadh npm test

      - name: Unit tests (America/Los_Angeles, UTC-7)
        if: github.event_name == 'push'
        run: TZ=America/Los_Angeles npm test

  e2e-smoke:
    name: E2E smoke (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary
        run: node scripts/ensure-electron.js

      - name: E2E smoke
        run: xvfb-run -a npm run test:e2e

      - name: E2E smoke (Bed Ready flavor + branding guard)
        run: xvfb-run -a npm run test:e2e:bedready

      # Reads the live application menu out of BOTH flavours' main processes.
      # A menu template cannot be reached from a unit test, and the Bed Ready
      # half is what stops the Khayt subreddit appearing in the other brand.
      - name: E2E Help menu (both flavors)
        run: xvfb-run -a npm run test:e2e:help

      # The only suite that renders every theme's dashboard/queue, so it is the
      # only place the shared-shell regressions get caught: search-bar layout,
      # reconnecting-vs-offline, and that the demo store actually seeds. It was
      # the one e2e suite missing from CI, which is why a broken top-bar search
      # shipped unnoticed.
      - name: E2E smoke (theme shells + RTL)
        run: xvfb-run -a npm run test:e2e:themes

      # Focus is a runtime property — a source scan cannot tell you whether a
      # modal is reachable without a mouse. A static read of this very code
      # concluded (wrongly) that nothing focused the modal; running it took ten
      # seconds to disprove that.
      # Quoted: an unquoted "keyboard: " in a YAML scalar starts a mapping, and
      # the whole workflow then fails to parse — a 0-second red build.
      - name: "E2E smoke (keyboard: modal focus, trap, Escape)"
        run: xvfb-run -a npm run test:e2e:a11y

      - name: E2E smoke (file to estimate to quote)
        run: xvfb-run -a npm run test:e2e:intake

      - name: E2E smoke (customer prices their own model)
        run: xvfb-run -a npm run test:e2e:intakequote

      - name: E2E smoke (measured actuals from the printer)
        run: xvfb-run -a npm run test:e2e:actuals

      - name: E2E — completion history reaches the renderer
        run: xvfb-run -a npm run test:e2e:pollcache

      - name: E2E smoke (settings that worked)
        run: xvfb-run -a npm run test:e2e:setups

      - name: E2E smoke (already have this model)
        run: xvfb-run -a npm run test:e2e:dedupe

      - name: E2E smoke (3MF work stays off the main thread)
        run: xvfb-run -a npm run test:e2e:3mfworker

      - name: E2E smoke (order to print file link)
        run: xvfb-run -a npm run test:e2e:filelink

      - name: E2E smoke (estimator settings and calibration)
        run: xvfb-run -a npm run test:e2e:estimator

      # Both are UI wiring, the class a unit test cannot vouch for: the fee
      # module can be perfect while the dropdown appends nothing, and the CSS
      # token can exist while no code ever sets it.
      - name: E2E smoke (marketplace fees, low-stock colour, product docs)
        run: xvfb-run -a npm run test:e2e:david

      # lib/tax.js is pure and heavily unit-tested; what those tests cannot say
      # is whether the INVOICE uses it. The rendered total was fmtMoney(price),
      # correct only while every price was assumed tax-inclusive — under
      # exclusive pricing that invoices a US shop for less than it charges.
      - name: E2E smoke (tax — inclusive, exclusive, multi-rate)
        run: xvfb-run -a npm run test:e2e:tax

      # Plants a store from an older schema holding a collection this build does
      # not recognise, then proves the pre-upgrade backup still contains it AFTER
      # the live store has lost it. That loss is demonstrated by the test rather
      # than hypothesised — it is what normalizeStoreSnapshot's allowlist does by
      # design, and the backup is the thing standing between it and a shop's data.
      - name: E2E smoke (data survives a bad upgrade)
        run: xvfb-run -a npm run test:e2e:upgradebackup

      # Roughly twenty places in renderInvoice can emit a second language, and
      # missing one leaves Arabic on an English quote with every unit test still
      # green. This reads the rendered document back. It also holds the ZATCA
      # guarantee: Arabic is legally required on a Saudi tax invoice, so no
      # setting may remove it.
      - name: E2E smoke (document language, incl. ZATCA compliance)
        run: xvfb-run -a npm run test:e2e:invlang

      - name: E2E smoke (QC / reprint / RMA)
        run: xvfb-run -a npm run test:e2e:qc

      - name: E2E smoke (organisation overview — money & late)
        run: xvfb-run -a npm run test:e2e:orgview

      - name: E2E smoke (printer catalog + auto-fill + pricing)
        run: xvfb-run -a npm run test:e2e:printers

      - name: E2E smoke (shipping & fulfillment)
        run: xvfb-run -a npm run test:e2e:shipping

      - name: E2E smoke (BOM / assembly)
        run: xvfb-run -a npm run test:e2e:bom

      - name: E2E smoke (privacy / PDPL)
        run: xvfb-run -a npm run test:e2e:privacy

      - name: E2E smoke (assembly tracking)
        run: xvfb-run -a npm run test:e2e:assembly

      - name: E2E smoke (scoped API tokens)
        run: xvfb-run -a npm run test:e2e:apitokens

      # CI has no printers on its network, so this proves the IPC contract and the
      # timeout bound; on a developer LAN it additionally validates real results.
      - name: E2E smoke (printer discovery)
        run: xvfb-run -a npm run test:e2e:discovery

      - name: E2E smoke (quit flushes pending save)
        run: xvfb-run -a npm run test:e2e:quitflush

      # Empty stores hide crashes: the analytics utilisation chart returns early with no
      # machines, so a ReferenceError there survived every empty-state check.
      - name: E2E smoke (populated screens render clean)
        run: xvfb-run -a npm run test:e2e:screens

      - name: E2E smoke (webhook event bus)
        run: xvfb-run -a npm run test:e2e:webhooks

      - name: E2E smoke (telemetry consent gate)
        run: xvfb-run -a npm run test:e2e:telemetry

      - name: E2E smoke (durable webhook retry)
        run: xvfb-run -a npm run test:e2e:webhookretry

      - name: E2E smoke (copy buttons reach the OS clipboard)
        run: xvfb-run -a npm run test:e2e:clipboard

      - name: E2E smoke (cloud price ladder)
        run: xvfb-run -a npm run test:e2e:cloudplans
