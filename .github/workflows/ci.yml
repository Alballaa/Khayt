name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check renderer/app.js
        run: node --check renderer/app.js

      - name: Check renderer/i18n.js
        run: node --check renderer/i18n.js

      - name: Check main.js
        run: node --check main.js

      - name: Check preload.js
        run: node --check preload.js
