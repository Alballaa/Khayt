name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # CI runs in UTC, which is the one timezone where a UTC-derived calendar
      # day happens to be correct — so a whole class of bug was invisible here.
      # A quote stayed approvable after expiry, an order taken at 01:00 local was
      # dated yesterday into revenue-by-day, and a monthly expense walked
      # backwards a day every cycle. Run the suite where the two calendars
      # disagree, in both directions.
      - name: Unit tests (Asia/Riyadh, UTC+3 — the primary market)
        run: TZ=Asia/Riyadh npm test

      - name: Unit tests (America/Los_Angeles, UTC-7)
        run: TZ=America/Los_Angeles npm test

      - name: Unit tests (Pacific/Kiritimati, UTC+14 — the far edge)
        run: TZ=Pacific/Kiritimati npm test

  e2e-smoke:
    name: E2E smoke (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary
        run: node scripts/ensure-electron.js

      - name: E2E smoke
        run: xvfb-run -a npm run test:e2e

      - name: E2E smoke (Bed Ready flavor + branding guard)
        run: xvfb-run -a npm run test:e2e:bedready

      # The only suite that renders every theme's dashboard/queue, so it is the
      # only place the shared-shell regressions get caught: search-bar layout,
      # reconnecting-vs-offline, and that the demo store actually seeds. It was
      # the one e2e suite missing from CI, which is why a broken top-bar search
      # shipped unnoticed.
      - name: E2E smoke (theme shells + RTL)
        run: xvfb-run -a npm run test:e2e:themes

      # Focus is a runtime property — a source scan cannot tell you whether a
      # modal is reachable without a mouse. A static read of this very code
      # concluded (wrongly) that nothing focused the modal; running it took ten
      # seconds to disprove that.
      # Quoted: an unquoted "keyboard: " in a YAML scalar starts a mapping, and
      # the whole workflow then fails to parse — a 0-second red build.
      - name: "E2E smoke (keyboard: modal focus, trap, Escape)"
        run: xvfb-run -a npm run test:e2e:a11y

      - name: E2E smoke (QC / reprint / RMA)
        run: xvfb-run -a npm run test:e2e:qc

      - name: E2E smoke (printer catalog + auto-fill + pricing)
        run: xvfb-run -a npm run test:e2e:printers

      - name: E2E smoke (shipping & fulfillment)
        run: xvfb-run -a npm run test:e2e:shipping

      - name: E2E smoke (BOM / assembly)
        run: xvfb-run -a npm run test:e2e:bom

      - name: E2E smoke (privacy / PDPL)
        run: xvfb-run -a npm run test:e2e:privacy

      - name: E2E smoke (assembly tracking)
        run: xvfb-run -a npm run test:e2e:assembly

      - name: E2E smoke (scoped API tokens)
        run: xvfb-run -a npm run test:e2e:apitokens

      # CI has no printers on its network, so this proves the IPC contract and the
      # timeout bound; on a developer LAN it additionally validates real results.
      - name: E2E smoke (printer discovery)
        run: xvfb-run -a npm run test:e2e:discovery

      - name: E2E smoke (quit flushes pending save)
        run: xvfb-run -a npm run test:e2e:quitflush

      # Empty stores hide crashes: the analytics utilisation chart returns early with no
      # machines, so a ReferenceError there survived every empty-state check.
      - name: E2E smoke (populated screens render clean)
        run: xvfb-run -a npm run test:e2e:screens

      - name: E2E smoke (webhook event bus)
        run: xvfb-run -a npm run test:e2e:webhooks

      - name: E2E smoke (telemetry consent gate)
        run: xvfb-run -a npm run test:e2e:telemetry

      - name: E2E smoke (durable webhook retry)
        run: xvfb-run -a npm run test:e2e:webhookretry
