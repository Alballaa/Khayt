name: Notify website on release

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website sync
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_SYNC_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Alballaa/khayt-website/dispatches \
            -d '{"event_type":"khayt-release","client_payload":{"tag":"${{ github.event.release.tag_name }}"}}'
          echo "Website sync triggered for ${{ github.event.release.tag_name }}"
