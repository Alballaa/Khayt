openapi: 3.0.3
info:
  title: Khayt Local API
  version: "1.0.0"
  description: |
    The HTTP API served by Khayt's embedded LAN server (`lib/lan-server.js`).

    **This is the shop's own server, on the shop's own network** — it is not a hosted
    cloud API. It works with cloud entirely off. Base URL is the desktop machine's LAN
    address, e.g. `http://192.168.1.20:3219`.

    Every route below is served under **`/v1`** (the documented, stable surface) and also
    under **`/api`**, which remains a permanent alias for the iOS Companion and the
    LAN web app. Within `/v1`, changes are additive only.

    Only endpoints that actually exist are documented here.
  license:
    name: See LICENSE
    url: https://github.com/KhaytApp/Khayt/blob/main/LICENSE

servers:
  - url: http://{host}:{port}/v1
    description: Khayt desktop on the local network
    variables:
      host: { default: "192.168.1.20" }
      port: { default: "3219" }

security:
  - ApiToken: []
  - OwnerPin: []

components:
  securitySchemes:
    ApiToken:
      type: http
      scheme: bearer
      description: |
        A scoped token minted in **Settings → API Tokens**, sent as
        `Authorization: Bearer khayt_…`.

        Tokens are shown once and stored only as a SHA-256 hash. Each carries an explicit
        scope set — `orders:read`, `orders:write`, `clients:read`, `clients:write`,
        `inventory:read`, `inventory:write`, `machines:read` — and gets nothing else.
        Using a token outside its scopes returns **403 `insufficient_scope`**; an unknown
        or revoked token returns **401 `invalid_token`**, with no caching.
    OwnerPin:
      type: apiKey
      in: header
      name: x-khayt-pin
      description: The owner LAN PIN. Unchanged; used by the iOS app and the LAN web app.

  responses:
    Unauthorized:
      description: Missing, unknown or revoked credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            invalidToken: { value: { error: invalid_token } }
    Forbidden:
      description: The token is valid but lacks the required scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ScopeError' }
          examples:
            insufficientScope:
              value: { error: insufficient_scope, required: "orders:write" }
    TooManyRequests:
      description: Too many failed auth attempts from this address (10/min).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    ScopeError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            required: { type: string, example: "orders:write" }
    Order:
      type: object
      properties:
        id: { type: string, example: "INV-2026-0001" }
        date: { type: string, format: date }
        project: { type: string }
        status:
          type: string
          enum: [quote, pending, printing, post, qc, completed, delivered, on_hold]
        price: { type: number }
        currency: { type: string, nullable: true }
        material: { type: string }
        printTime: { type: number, description: Hours }
        dueDate: { type: string, format: date, nullable: true }
        clientId: { type: string, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        carrier:
          type: string
          nullable: true
          description: Shipping carrier adapter id.
          enum: [smsa, aramex, spl, manual, null]
        trackingNumber: { type: string, nullable: true }
        shippingStatus:
          type: string
          nullable: true
          enum: [unshipped, label_created, in_transit, out_for_delivery, delivered, exception, null]
        qcStatus:
          type: string
          nullable: true
          enum: [pending, pass, fail, null]
    OrderPatch:
      type: object
      description: Only the listed fields are writable; anything else is ignored.
      properties:
        status:
          type: string
          enum: [pending, printing, post, qc, completed, delivered, on_hold]
        machineId: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        notes: { type: string }
    Client:
      type: object
      properties:
        id: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        phone: { type: string }
        email: { type: string }
    Spool:
      type: object
      properties:
        id: { type: string }
        material: { type: string, example: PLA }
        color: { type: string }
        weight: { type: number, description: Grams remaining }
        cost: { type: number }
    Machine:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        isOffline: { type: boolean }
        printerModel: { type: string, nullable: true }
    Status:
      type: object
      description: Public counts only — no shop data. This route needs no auth.
      properties:
        ok: { type: boolean }
        version: { type: string }

paths:
  /status:
    get:
      summary: Server heartbeat and public counts
      security: []
      tags: [status]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }

  /orders:
    get:
      summary: List orders
      tags: [orders]
      description: Requires scope `orders:read`.
      parameters:
        - in: query
          name: status
          schema: { type: string }
          description: Filter by order status.
        - in: query
          name: limit
          schema: { type: integer, maximum: 200, default: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      summary: Create an order or quote
      tags: [orders]
      description: Requires scope `orders:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Body exceeds the 1 MB cap. }

  /orders/{id}:
    patch:
      summary: Update an order
      tags: [orders]
      description: Requires scope `orders:write`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such order. }

  /queue:
    get:
      summary: The active print queue
      tags: [orders]
      description: Requires scope `orders:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /clients:
    get:
      summary: List clients
      tags: [clients]
      description: Requires scope `clients:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Client' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /inventory:
    get:
      summary: List filament spools
      tags: [inventory]
      description: Requires scope `inventory:read`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Spool' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Add a spool
      tags: [inventory]
      description: Requires scope `inventory:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Spool' }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Spool' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /inventory/{id}:
    patch:
      summary: Update a spool
      tags: [inventory]
      description: Requires scope `inventory:write`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Spool' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Remove a spool
      tags: [inventory]
      description: Requires scope `inventory:write`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  /machines:
    get:
      summary: List machines
      tags: [machines]
      description: Requires scope `machines:read`. Machines are read-only over the API.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Machine' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /machines/live:
    get:
      summary: Live printer status (from the polling cache)
      tags: [machines]
      description: Requires scope `machines:read`.
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /waiting-list:
    get:
      summary: List waiting-list / intake entries
      tags: [waiting-list]
      description: Requires scope `clients:read`.
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

tags:
  - name: status
  - name: orders
  - name: clients
  - name: inventory
  - name: machines
  - name: waiting-list
