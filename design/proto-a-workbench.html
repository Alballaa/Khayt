<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khayt — Workbench</title>
<style>
/* ============================================================
   Khayt · Direction A "WORKBENCH"
   Native macOS-style productivity app prototype.
   Single file, inline CSS+JS, mock data, no deps.
   ============================================================ */

/* ---------- Design tokens ---------- */
:root{
  --bg:        #f7f8fa;   /* warm soft off-white window backdrop */
  --bg-2:      #eef0f4;   /* sidebar wash */
  --panel:     #ffffff;
  --panel-2:   #fbfbfd;
  --ink:       #1c1f26;
  --ink-2:     #5b6473;
  --ink-3:     #8a92a3;
  --line:      #e6e8ee;
  --line-2:    #eef0f4;
  --accent:    #4f5bf2;   /* confident indigo */
  --accent-ink:#ffffff;
  --accent-soft:#eceefe;
  --shadow-1:  0 1px 0 rgba(20,24,38,.04), 0 1px 2px rgba(20,24,38,.05);
  --shadow-2:  0 8px 30px rgba(20,24,38,.10), 0 1px 2px rgba(20,24,38,.05);
  --radius:    12px;
  --radius-sm: 9px;

  /* status palette */
  --blue:#2f6bff; --blue-bg:#e7f0ff;
  --green:#19a463; --green-bg:#e3f6ec;
  --red:#e0453a;  --red-bg:#fdeae8;
  --amber:#cf8a00; --amber-bg:#fdf3da;
  --purple:#8a4fe6; --purple-bg:#f1e9fd;
  --teal:#0fb5ba; --teal-bg:#e0f7f7;
  --pink:#e0518e; --pink-bg:#fde9f1;

  --font: -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#15171c; --bg-2:#1b1e25; --panel:#22262f; --panel-2:#1d2027;
  --ink:#eef0f5; --ink-2:#a4adbd; --ink-3:#7a8398;
  --line:#2d323d; --line-2:#262b34;
  --accent:#7a85ff; --accent-soft:#2a2e57;
  --shadow-1:0 1px 0 rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 10px 34px rgba(0,0,0,.5);
  --blue-bg:#16294d; --green-bg:#143226; --red-bg:#3a1c1a; --amber-bg:#352b12;
  --purple-bg:#2a1f44; --teal-bg:#0e3133; --pink-bg:#3a1f2e;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:13.5px; line-height:1.45;
  overflow:hidden;
}
button{font-family:inherit}
::selection{background:var(--accent-soft)}

/* ---------- App window shell ---------- */
.window{
  height:100vh; display:grid;
  grid-template-columns:248px 1fr;
  grid-template-rows:38px 1fr 30px;
  grid-template-areas:
    "titlebar titlebar"
    "sidebar  main"
    "sidebar  statusbar";
  background:var(--bg);
}

/* ---------- Title bar (traffic lights) ---------- */
.titlebar{
  grid-area:titlebar; -webkit-app-region:drag;
  display:flex; align-items:center; gap:10px;
  padding:0 14px; background:linear-gradient(var(--bg-2),var(--bg));
  border-bottom:1px solid var(--line);
}
.lights{display:flex; gap:8px}
.light{width:12px;height:12px;border-radius:50%}
.light.r{background:#ff5f57} .light.y{background:#febc2e} .light.g{background:#28c840}
.titlebar .ttl{font-weight:600;font-size:12.5px;color:var(--ink-2);letter-spacing:.2px}
.titlebar .spacer{flex:1}
.titlebar .crumb{color:var(--ink-3);font-size:12px}
.titlebar .crumb b{color:var(--ink-2);font-weight:600}

/* ---------- Sidebar ---------- */
.sidebar{
  grid-area:sidebar; background:var(--bg-2);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  padding:10px 10px 8px;
  overflow:auto;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:6px 8px 12px;
}
.brand .logo{
  width:30px;height:30px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#7c6bff);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 2px 6px rgba(79,91,242,.4);
}
.brand .name{font-weight:700;font-size:14px}
.brand .sub{font-size:11px;color:var(--ink-3);margin-top:-2px}

.search{
  display:flex;align-items:center;gap:7px;margin:0 4px 10px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 9px;color:var(--ink-3);font-size:12.5px;
  box-shadow:var(--shadow-1);cursor:pointer;
}
.search input{border:0;background:transparent;outline:none;flex:1;color:var(--ink);font-size:12.5px;cursor:pointer}
.search kbd{font-family:var(--font);font-size:10.5px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--bg-2)}

.nav-group{margin:4px 0 2px}
.nav-group .label{
  font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:var(--ink-3);padding:8px 10px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:6px 9px;border:0;background:transparent;border-radius:8px;
  color:var(--ink);font-size:13px;cursor:pointer;text-align:left;
  position:relative;
}
.nav-item:hover{background:rgba(120,130,150,.10)}
.nav-item.active{background:var(--panel);box-shadow:var(--shadow-1);font-weight:600}
.nav-item.active::before{
  content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:3px;background:var(--accent);
}
.glyph{
  width:24px;height:24px;border-radius:7px;flex:none;
  display:grid;place-items:center;color:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.15);
}
.glyph svg{width:14px;height:14px}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--ink-3);
  background:rgba(120,130,150,.14);border-radius:20px;padding:1px 7px;font-weight:600}
.nav-item.active .count{background:var(--accent-soft);color:var(--accent)}

.sidebar .grow{flex:1}
.sidebar .acct{
  display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow-1);
}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#ffb86b,#ff7a90);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px}
.acct .who{font-size:12px;font-weight:600;line-height:1.1}
.acct .biz{font-size:10.5px;color:var(--ink-3)}

/* ---------- Main column ---------- */
.main{grid-area:main; display:flex; flex-direction:column; overflow:hidden; background:var(--bg)}

/* Toolbar */
.toolbar{
  display:flex;align-items:center;gap:8px;
  padding:9px 16px; border-bottom:1px solid var(--line);
  background:linear-gradient(var(--panel),var(--panel-2));
  min-height:50px;
}
.toolbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px}
.toolbar .tb-spacer{flex:1}
.tbtn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--panel);
  border-radius:8px;padding:6px 11px;font-size:12.5px;color:var(--ink);
  cursor:pointer;box-shadow:var(--shadow-1);
}
.tbtn:hover{background:var(--bg-2)}
.tbtn svg{width:14px;height:14px;opacity:.8}
.tbtn.primary{
  background:var(--accent);color:#fff;border-color:transparent;font-weight:600;
  box-shadow:0 2px 8px rgba(79,91,242,.35);
}
.tbtn.primary:hover{filter:brightness(1.06)}
.tbtn.primary svg{opacity:1}

/* Segmented control */
.seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);
  border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 11px;
  font-size:12px;color:var(--ink-2);cursor:pointer;font-weight:500}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-1);font-weight:600}

/* Scroll body */
.body{flex:1;overflow:auto;padding:18px 20px 26px}
.screen{display:none;animation:fade .18s ease}
.screen.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Status bar ---------- */
.statusbar{
  grid-area:statusbar;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:linear-gradient(var(--bg),var(--bg-2));
  border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-2);
}
.statusbar .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.statusbar .sepr{color:var(--ink-3);opacity:.5}
.statusbar .ok{color:var(--green);font-weight:600}
.statusbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}

/* ---------- Generic native panel ---------- */
.panel{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow-1);
}
.panel-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.panel-h h3{margin:0;font-size:13px;font-weight:700}
.panel-h .meta{margin-left:auto;font-size:11.5px;color:var(--ink-3)}

/* Grouped inset list (native) */
.glist{list-style:none;margin:0;padding:0}
.glist li{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.glist li:last-child{border-bottom:0}
.glist li:hover{background:var(--panel-2)}
.glist .ttl{font-weight:600;font-size:13px}
.glist .sub{font-size:11.5px;color:var(--ink-3)}
.glist .tail{margin-left:auto;display:flex;align-items:center;gap:8px}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2px 9px;border-radius:20px;line-height:1.6;white-space:nowrap}
.chip .cd{width:6px;height:6px;border-radius:50%}
.chip.blue{color:var(--blue);background:var(--blue-bg)}
.chip.green{color:var(--green);background:var(--green-bg)}
.chip.red{color:var(--red);background:var(--red-bg)}
.chip.amber{color:var(--amber);background:var(--amber-bg)}
.chip.purple{color:var(--purple);background:var(--purple-bg)}
.chip.teal{color:var(--teal);background:var(--teal-bg)}
.chip.gray{color:var(--ink-2);background:rgba(120,130,150,.14)}

/* Stat row (tight native KPIs) */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.stat .k{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:4px}
.stat .d{font-size:11px;margin-top:2px;font-weight:600}
.stat .d.up{color:var(--green)} .stat .d.dn{color:var(--red)} .stat .d.mut{color:var(--ink-3)}
.stat .badge{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;
  display:grid;place-items:center}
.stat .badge svg{width:16px;height:16px}

/* Two-column grids */
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1080px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(2,1fr)}}

/* Progress */
.bar{height:7px;border-radius:6px;background:var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),#7c6bff)}
.bar.green>i{background:linear-gradient(90deg,#19a463,#3ad487)}
.bar.amber>i{background:linear-gradient(90deg,#cf8a00,#f4b53b)}

/* Fleet mini */
.fleet-mini{display:grid;gap:10px;padding:12px 14px}
.fm-row{display:grid;grid-template-columns:78px 1fr 56px;align-items:center;gap:10px;font-size:12px}
.fm-row .nm{font-weight:600}

/* Printer cards */
.printers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:1080px){.printers{grid-template-columns:repeat(2,1fr)}}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow-1);overflow:hidden}
.pcard .top{display:flex;align-items:center;gap:10px;padding:13px 14px 6px}
.pcard .pico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff}
.pcard .pname{font-weight:700;font-size:13.5px}
.pcard .pmod{font-size:11px;color:var(--ink-3)}
.pcard .pbody{padding:8px 14px 14px}
.pcard .job{font-size:12px;color:var(--ink-2);margin:6px 0 9px}
.pcard .job b{color:var(--ink)}
.pcard .stat-row{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:8px}
.pcard .stat-row b{color:var(--ink);font-weight:700;font-size:12px}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
@media(max-width:1080px){.kanban{grid-template-columns:repeat(2,1fr)}}
.kcol{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.kcol .kh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:2px 4px 10px}
.kcol .kh .n{margin-left:auto;font-size:11px;color:var(--ink-3);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:0 7px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  box-shadow:var(--shadow-1);margin-bottom:9px;cursor:grab}
.kcard:hover{box-shadow:var(--shadow-2)}
.kcard .kt{font-weight:600;font-size:12.5px}
.kcard .km{font-size:11px;color:var(--ink-3);margin-top:2px;display:flex;gap:8px;align-items:center}
.kcard .kf{display:flex;align-items:center;gap:6px;margin-top:8px}
.kcard .who{font-size:10.5px;color:var(--ink-3);margin-left:auto}

/* Calculator layout */
.calc{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media(max-width:980px){.calc{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;
  padding:8px 10px;font-size:13px;color:var(--ink);outline:none;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--panel)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.summary{position:sticky;top:0}
.sum-line{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.sum-line b{color:var(--ink);font-weight:600}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px}
.sum-total .t{font-size:12px;color:var(--ink-3);font-weight:600}
.sum-total .a{font-size:28px;font-weight:800;letter-spacing:-.5px}
.btn-block{width:100%;justify-content:center;margin-top:4px;padding:9px}
.btn-ghost{width:100%;justify-content:center;margin-top:8px;padding:8px;
  background:transparent;border:1px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.btn-ghost:hover{background:var(--bg-2)}

/* Table (inventory/clients/invoices) */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;padding:9px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl .nm{font-weight:600}
.tbl .muted{color:var(--ink-3)}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;vertical-align:-2px;margin-right:7px;border:1px solid rgba(0,0,0,.08)}
.dots{position:relative}
.dots .menu-btn{border:0;background:transparent;color:var(--ink-3);cursor:pointer;border-radius:6px;padding:2px 8px;font-size:16px;line-height:1}
.dots .menu-btn:hover{background:var(--bg-2);color:var(--ink)}
.menu{position:absolute;right:0;top:26px;z-index:30;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow-2);min-width:170px;padding:5px;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  text-align:left;padding:7px 9px;border-radius:6px;font-size:12.5px;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--bg-2)}
.menu button.danger{color:var(--red)}
.menu .sep{height:1px;background:var(--line-2);margin:4px 0}

/* loc chips group */
.locs{display:flex;gap:6px;flex-wrap:wrap}

/* Analytics bars */
.chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding:10px 14px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart .col .b{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,var(--accent),#7c6bff)}
.chart .col .lab{font-size:10.5px;color:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);padding:0 14px 12px}
.legend .li{display:flex;align-items:center;gap:6px}

/* Settings */
.set-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.set-row:last-child{border-bottom:0}
.set-row .info{flex:1}
.set-row .info .t{font-weight:600;font-size:13px}
.set-row .info .d{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.toggle{width:42px;height:25px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none;transition:.15s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:19px}
.saved{font-size:11.5px;color:var(--green);font-weight:600;opacity:0;transition:.2s;display:inline-flex;gap:5px;align-items:center}
.saved.show{opacity:1}

.attn-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.section-title{font-size:12px;font-weight:700;color:var(--ink-2);margin:18px 2px 9px;letter-spacing:.2px}

/* command palette */
.cmd-overlay{position:fixed;inset:0;background:rgba(20,24,38,.28);backdrop-filter:blur(2px);
  display:none;align-items:flex-start;justify-content:center;z-index:100;padding-top:14vh}
.cmd-overlay.show{display:flex}
.cmd{width:540px;max-width:90vw;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow-2);overflow:hidden}
.cmd input{width:100%;border:0;outline:none;background:transparent;padding:15px 17px;font-size:15px;color:var(--ink);
  border-bottom:1px solid var(--line-2)}
.cmd .res{max-height:320px;overflow:auto;padding:6px}
.cmd .res button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;
  padding:9px 11px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink);font-size:13px}
.cmd .res button.sel,.cmd .res button:hover{background:var(--accent-soft)}
.cmd .res .hint{margin-left:auto;font-size:11px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="window">

  <!-- ===== Title bar ===== -->
  <div class="titlebar">
    <div class="lights"><span class="light r"></span><span class="light y"></span><span class="light g"></span></div>
    <span class="ttl">Khayt</span>
    <div class="spacer"></div>
    <span class="crumb">Workbench · <b id="crumb">Dashboard</b></span>
  </div>

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">K</div>
      <div>
        <div class="name">Khayt</div>
        <div class="sub">3D Print Shop</div>
      </div>
    </div>

    <div class="search" onclick="openCmd()">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input placeholder="Search or jump…" readonly>
      <kbd>⌘K</kbd>
    </div>

    <nav id="nav"></nav>

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  NAV.forEach(grp=>{

    if(grp.g) wrap.innerHTML=`<div class="label">${grp.g}</div>`;
    grp.items.forEach(it=>{
      const b=document.createElement('button');
      b.className='nav-item'+(it.id===current?' active':'');
      b.dataset.id=it.id;
      b.innerHTML=`<span class="glyph" style="background:${it.c}">${svg(it.ic)}</span>
        <span>${it.name}</span>${it.count!=null?`<span class="count">${it.count}</span>`:''}`;
      b.onclick=()=>go(it.id);
      wrap.appendChild(b);
    });
    nav.appendChild(wrap);
  });

/* =========================================================

   ========================================================= */
let current='dash';
function go(id){
  current=id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.id===id));

}

/* =========================================================

function tbar(title,{seg=null,primary=null,extras=''}={}){
  let h=`<h1>${title}</h1>`;
  if(seg){
    h+=`<div class="seg" style="margin-left:10px">`+
      seg.map((s,i)=>`<button class="${i===0?'on':''}" onclick="segPick(this)">${s}</button>`).join('')+`</div>`;
  }
  h+=`<div class="tb-spacer"></div>`+extras;
  if(primary) h+=`<button class="tbtn primary">${svg(ICON[primary.ic])}${primary.label}</button>`;
  return h;
}
function segPick(el){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));el.classList.add('on')}

/* =========================================================
   Row helpers
   ========================================================= */
function jobRow(t,s,cls,label,col,pct){
  return `<li>
    <span class="attn-ico" style="background:${col}1f;color:${col}">${svg(ICON.printer)}</span>
    <div><div class="ttl">${t}</div><div class="sub">${s}</div></div>
    <span class="tail">${pct?`<span style="font-size:11px;color:var(--ink-3);font-weight:600">${pct}</span>`:''}
    <span class="chip ${cls}"><span class="cd" style="background:${col}"></span>${label}</span></span></li>`;
}
function fmRow(nm,job,cls,pct){
  const fill = cls==='purple' ? 'background:linear-gradient(90deg,#8a4fe6,#b487f5)'
    : cls==='gray' ? 'background:var(--line)' : '';
  return `<div class="fm-row"><span class="nm">${nm}</span>
    <div class="bar"><i style="width:${pct||3}%;${fill}"></i></div>
    <span style="text-align:right;font-size:11px;color:var(--ink-3)">${pct?pct+'%':'idle'}</span></div>`;
}
function qa(id,label,c,ic){
  return `<button class="tbtn" style="justify-content:flex-start;padding:11px 12px" onclick="go('${id}')">
    <span class="glyph" style="background:${c};width:26px;height:26px">${svg(ic)}</span>${label}</button>`;
}
function kcol(title,col,cards){
  return `<div class="kcol"><div class="kh"><span class="cd" style="width:8px;height:8px;border-radius:50%;background:${col}"></span>${title}<span class="n">${cards.length}</span></div>${cards.join('')}</div>`;
}
function kcard(t,m,cls,due,who,pct){
  const col={blue:'var(--blue)',amber:'var(--amber)',purple:'var(--purple)',green:'var(--green)',gray:'var(--ink-3)'}[cls];
  return `<div class="kcard"><div class="kt">${t}</div><div class="km">${m}</div>
    ${pct?`<div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>`:''}
    <div class="kf"><span class="chip ${cls}"><span class="cd" style="background:${col}"></span>${due}</span>
    <span class="who">${who}</span></div></div>`;
}
function pcard(name,mod,cls,status,ic,job,pctTxt,pct,eta,temp,err){
  const map={blue:'var(--blue)',purple:'var(--purple)',green:'var(--green)',teal:'var(--teal)',red:'var(--red)'};
  const col=map[cls];
  const fill = err ? 'background:linear-gradient(90deg,#e0453a,#f47a72)'
    : cls==='purple' ? 'background:linear-gradient(90deg,#8a4fe6,#b487f5)'
    : cls==='teal' ? 'background:linear-gradient(90deg,#0fb5ba,#5fdfe2)'
    : cls==='green' ? 'background:linear-gradient(90deg,#19a463,#3ad487)' : '';
  return `<div class="pcard">
    <div class="top"><span class="pico" style="background:${col}">${svg(ic,16)}</span>
      <div><div class="pname">${name}</div><div class="pmod">${mod}</div></div>
      <span class="chip ${cls}" style="margin-left:auto"><span class="cd" style="background:${col}"></span>${status}</span></div>
    <div class="pbody">
      <div class="job">${err?'⚠ ':''}<b>${job}</b></div>
      <div class="bar"><i style="width:${pct}%;${fill}"></i></div>
      <div class="stat-row"><span>Progress <b>${pctTxt}</b></span><span>ETA <b>${eta}</b></span><span>Temp <b>${temp}</b></span></div>
    </div></div>`;
}

function rowMenu(){

function clientRow(name,ini,c,type,orders,ltv,last,cls,status){

function matBar(name,c,pct){

function setToggle(t,d,on){
  return `<div class="set-row"><div class="info"><div class="t">${t}</div><div class="d">${d}</div></div>
    <button class="toggle ${on?'on':''}" onclick="this.classList.toggle('on');flashSaved()"></button></div>`;

/* =========================================================
   Calculator live recalc
   ========================================================= */
function recalc(){
  const w=+document.getElementById('cWeight').value||0;
  const t=+document.getElementById('cTime').value||0;
  const qty=+document.getElementById('cQty').value||1;
  const m=+document.getElementById('cMargin').value||0.45;
  const mat=w*0.15, time=t*10, post=25, elec=9;
  const base=mat+time+post+elec;
  const margin=base*m;
  const sub=base+margin;
  const vat=sub*0.15;
  const total=(sub+vat)*qty;
  const f=n=>'SAR '+n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('sMat').textContent=f(mat);
  document.getElementById('sTime').textContent=f(time);
  document.getElementById('sMargin').textContent=f(margin);
  document.getElementById('sVat').textContent=f(vat*qty);
  document.getElementById('sTotal').textContent=f(total);
}

/* =========================================================
   Theme + accent
   ========================================================= */
let theme='light', accent='#4f5bf2';
function setTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t);if(current==='set')go('set');flashSaved()}
function toggleTheme(){setTheme(theme==='light'?'dark':'light')}
function setAccent(c){accent=c;document.documentElement.style.setProperty('--accent',c);if(current==='set')go('set');flashSaved()}
function flashSaved(){const s=document.getElementById('setSaved');if(!s)return;s.classList.add('show');clearTimeout(window._sv);window._sv=setTimeout(()=>s.classList.remove('show'),1600)}

/* =========================================================
   Row ⋯ menu
   ========================================================= */
function toggleMenu(btn){
  const m=btn.nextElementSibling;const wasOpen=m.classList.contains('open');
  document.querySelectorAll('.menu.open').forEach(x=>x.classList.remove('open'));
  if(!wasOpen)m.classList.add('open');
}
document.addEventListener('click',e=>{if(!e.target.closest('.dots'))document.querySelectorAll('.menu.open').forEach(x=>x.classList.remove('open'))});

/* =========================================================
   Command palette
   ========================================================= */
const CMD=[].concat(...NAV.map(g=>g.items)).map(i=>({id:i.id,name:i.name,ic:i.ic,c:i.c}));
let cmdSel=0;
function openCmd(){document.getElementById('cmdOverlay').classList.add('show');const i=document.getElementById('cmdInput');i.value='';filterCmd();setTimeout(()=>i.focus(),20)}
function closeCmd(){document.getElementById('cmdOverlay').classList.remove('show')}
function filterCmd(){
  const q=document.getElementById('cmdInput').value.toLowerCase();
  const list=CMD.filter(c=>c.name.toLowerCase().includes(q));cmdSel=0;
  document.getElementById('cmdRes').innerHTML=list.map((c,i)=>
    `<button class="${i===0?'sel':''}" data-id="${c.id}" onclick="go('${c.id}');closeCmd()">
      <span class="glyph" style="background:${c.c};width:22px;height:22px">${svg(c.ic)}</span>${c.name}<span class="hint">↵</span></button>`).join('')
    ||'<div style="padding:14px;color:var(--ink-3);font-size:13px">No matches</div>';
}
function cmdKey(e){
  const items=[...document.querySelectorAll('#cmdRes button')];if(!items.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdSel+1,items.length-1)}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(cmdSel-1,0)}
  else if(e.key==='Enter'){e.preventDefault();go(items[cmdSel].dataset.id);closeCmd();return}
  else if(e.key==='Escape'){closeCmd();return}
  items.forEach((b,i)=>b.classList.toggle('sel',i===cmdSel));
  items[cmdSel].scrollIntoView({block:'nearest'});
}

/* =========================================================
   Global keyboard niceties
   ========================================================= */
const SEQ=['dash','calc','queue','fleet','inv','clients','invoices','analytics','set'];
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='d'){e.preventDefault();toggleTheme();return}
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='Escape')closeCmd();
  if(/^[1-9]$/.test(e.key)){const i=+e.key-1;if(SEQ[i])go(SEQ[i])}
  if(e.key===']'||e.key==='['){const i=SEQ.indexOf(current);const n=e.key===']'?(i+1)%SEQ.length:(i-1+SEQ.length)%SEQ.length;go(SEQ[n])}
});

/* =========================================================
   Boot
   ========================================================= */
renderNav();
go('dash');
</script>
