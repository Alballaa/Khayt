<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khayt Companion — iOS Prototype</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; background: #0A0A0F; }
    #root { min-height: 100vh; }

<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" data-presets="react">

// ======================= ios-frame.jsx =======================
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

/* BEGIN USAGE */
// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports (to window): IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard
//
// Usage — wrap your screen content in <IOSDevice> to get the bezel, status bar
// and home indicator (props: title, dark, keyboard):
//
//   <IOSDevice title="Settings">
//     ...your screen content...
//   </IOSDevice>
//   <IOSDevice dark title="Search" keyboard>…</IOSDevice>
/* END USAGE */

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

// tweaks-panel.jsx
// Reusable Tweaks shell + form-control helpers.

// posts __edit_mode_available / __edit_mode_set_keys / __edit_mode_dismissed) so
// individual prototypes don't re-roll it. Ships a consistent set of controls so you
// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):
//
//   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
//     "primaryColor": "#D97757",
//     "palette": ["#D97757", "#29261b", "#f6f4ef"],
//     "fontSize": 16,
//     "density": "regular",
//     "dark": false
//   }/*EDITMODE-END*/;
//
//   function App() {
//     const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
//     return (
//       <div style={{ fontSize: t.fontSize, color: t.primaryColor }}>
//         Hello

//           <TweakSection label="Typography" />

//                        onChange={(v) => setTweak('fontSize', v)} />
//           <TweakRadio  label="Density" value={t.density}
//                        options={['compact', 'regular', 'comfy']}
//                        onChange={(v) => setTweak('density', v)} />
//           <TweakSection label="Theme" />
//           <TweakColor  label="Primary" value={t.primaryColor}
//                        options={['#D97757', '#2A6FDB', '#1F8A5B', '#7A5AE0']}
//                        onChange={(v) => setTweak('primaryColor', v)} />
//           <TweakColor  label="Palette" value={t.palette}
//                        options={[['#D97757', '#29261b', '#f6f4ef'],
//                                  ['#475569', '#0f172a', '#f1f5f9']]}
//                        onChange={(v) => setTweak('palette', v)} />
//           <TweakToggle label="Dark mode" value={t.dark}
//                        onChange={(v) => setTweak('dark', v)} />

//
// TweakRadio is the segmented control for 2–3 short options (auto-falls-back to
// TweakSelect past ~16/~10 chars per label); reach for TweakSelect directly when

/* END USAGE */

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// ─── Base Components ───────────────────────────────────────────────────────────

function StatusPill({ status, size = 'sm' }) {
  const { lang } = useTheme();
  const stage = STAGES[status] || STAGES.pending;
  const label = (lang === 'ar' && typeof STAGE_LABELS_AR !== 'undefined') ? STAGE_LABELS_AR[status] : stage.label;
  const lg = size === 'lg';
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: lg ? 6 : 5,
      padding: lg ? '5px 11px' : '3px 8px',
      borderRadius: 100,
      background: stage.bg,
      fontSize: lg ? 13 : 11,
      fontWeight: 600,
      color: stage.dot,
      letterSpacing: 0.2,
      whiteSpace: 'nowrap',
      flexShrink: 0,
      direction: 'ltr',
    }}>
      <span style={{
        width: lg ? 7 : 6, height: lg ? 7 : 6,
        borderRadius: '50%', background: stage.dot, flexShrink: 0,
      }} />
      {label}
    </span>
  );
}

function SectionLabel({ text, action, onAction, style: extraStyle = {} }) {
  const { t } = useTheme();
  return (
    <div style={{
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      padding: '0 16px', marginBottom: 6, ...extraStyle,
    }}>
      <span style={{
        fontSize: 12, fontWeight: 600, color: t.label2,
        letterSpacing: 0.7, textTransform: 'uppercase',
      }}>{text}</span>
      {action && (
        <button onClick={onAction} style={{
          background: 'none', border: 'none',
          fontSize: 14, fontWeight: 500, color: t.brand,
          cursor: 'pointer', padding: '2px 0',
        }}>{action}</button>
      )}
    </div>
  );
}

function Card({ children, style: extraStyle = {}, onClick }) {
  const { t } = useTheme();
  return (
    <div onClick={onClick} style={{
      background: t.surface,
      borderRadius: 16,
      overflow: 'hidden',
      cursor: onClick ? 'pointer' : undefined,
      ...extraStyle,
    }}>
      {children}
    </div>
  );
}

function ProgressBar({ value, color, height = 4, style: extraStyle = {} }) {
  const { t } = useTheme();
  return (
    <div style={{
      height, borderRadius: height,
      background: t.surface3, overflow: 'hidden', ...extraStyle,
    }}>
      <div style={{
        height: '100%', width: `${Math.min(100, Math.max(0, value))}%`,
        background: color, borderRadius: height,
        transition: 'width 0.4s ease',
      }} />
    </div>
  );
}

function EmptyState({ icon, title, subtitle, action, onAction }) {
  const { t } = useTheme();
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      justifyContent: 'center', padding: '52px 32px', gap: 10, textAlign: 'center',
    }}>
      <div style={{ fontSize: 44, opacity: 0.3, marginBottom: 4, lineHeight: 1 }}>{icon}</div>
      <div style={{ fontSize: 17, fontWeight: 600, color: t.label }}>{title}</div>
      {subtitle && (
        <div style={{ fontSize: 14, color: t.label2, lineHeight: 1.5, maxWidth: 260 }}>{subtitle}</div>
      )}
      {action && (
        <button onClick={onAction} style={{
          marginTop: 8, padding: '10px 24px',
          borderRadius: 12, background: t.brand,
          color: '#fff', border: 'none',
          fontSize: 15, fontWeight: 600, cursor: 'pointer',
        }}>{action}</button>
      )}
    </div>
  );
}

function Skeleton({ width = '100%', height = 16, radius = 8, style: extraStyle = {} }) {
  const { dark } = useTheme();
  return (
    <div style={{
      width, height, borderRadius: radius,
      background: dark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.05)',
      ...extraStyle,
    }} />
  );
}

function Divider({ inset = 16 }) {
  const { t } = useTheme();
  return (
    <div style={{
      height: 0.5,
      background: t.sep,
      margin: `0 ${inset}px`,
    }} />
  );
}

// ─── Global styles injected once ──────────────────────────────────────────────
(function injectStyles() {
  const style = document.createElement('style');
  style.textContent = `
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    button { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; }
    input, textarea { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; }
    ::-webkit-scrollbar { display: none; }
    @keyframes khayt-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes khayt-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes khayt-slide-up {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes khayt-nfc-ping {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2); opacity: 0; }
    }
  `;
  document.head.appendChild(style);
})();

// ─── Export ───────────────────────────────────────────────────────────────────

  ThemeContext, useTheme,

  NavContext, useNav,
  DARK_TOKENS, LIGHT_TOKENS,

  StatusPill, SectionLabel, Card, ProgressBar,
  EmptyState, Skeleton, Divider,
});

// ─── Bottom Sheet ──────────────────────────────────────────────────────────────

function BottomSheet({ visible, onDismiss, title, children, minHeight }) {
  const { t, dark } = useTheme();
  const [mounted, setMounted] = useState(false);
  const [open, setOpen] = useState(false);

  useEffect(() => {
    if (visible) {
      setMounted(true);
      requestAnimationFrame(() => requestAnimationFrame(() => setOpen(true)));
    } else {
      setOpen(false);
      const timer = setTimeout(() => setMounted(false), 340);
      return () => clearTimeout(timer);

  }, [visible]);

  if (!mounted) return null;

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 200,
      display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',

// ─── Swipeable Row ────────────────────────────────────────────────────────────

function SwipeRow({ children, onAdvance, canAdvance }) {
  const { t, s } = useTheme();
  const [offset, setOffset] = useState(0);
  const [open, setOpen] = useState(false);
  const startX = useRef(null);
  const ACTION_W = 80;

  const onStart = (x) => { startX.current = x; };
  const onMove = (x) => {
    if (startX.current === null) return;
    const d = x - startX.current;
    if (d < 0 && canAdvance) setOffset(Math.max(d, -ACTION_W - 10));
  };
  const onEnd = () => {
    startX.current = null;
    if (offset < -ACTION_W * 0.55) { setOffset(-ACTION_W); setOpen(true); }
    else { setOffset(0); setOpen(false); }
  };
  const doAdvance = () => { setOffset(0); setOpen(false); onAdvance(); };

  return (
    <div style={{ position: 'relative', overflow: 'hidden' }}>
      {canAdvance && (
        <div style={{
          position: 'absolute', right: 0, top: 0, bottom: 0, width: ACTION_W,
          background: STAGES.printing.dot,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          flexDirection: 'column', gap: 3, cursor: 'pointer',
        }} onClick={doAdvance}>
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
            <path d="M1 7h14M10 1l6 6-6 6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <span style={{ color: '#fff', fontSize: 10, fontWeight: 700, letterSpacing: 0.5 }}>{s('advance')}</span>
        </div>
      )}
      <div
        style={{
          transform: `translateX(${offset}px)`,
          transition: startX.current !== null ? 'none' : 'transform 0.25s ease',
          background: t.surface,
        }}
        onMouseDown={e => onStart(e.clientX)}
        onMouseMove={e => startX.current !== null && onMove(e.clientX)}
        onMouseUp={onEnd}
        onMouseLeave={onEnd}
        onTouchStart={e => onStart(e.touches[0].clientX)}
        onTouchMove={e => onMove(e.touches[0].clientX)}
        onTouchEnd={onEnd}
      >
        {children}
      </div>
    </div>
  );
}

            <span style={{ fontSize: 13, fontWeight: 600, color: t.label }}>{s('printProgress')}</span>

        <div style={{ display: 'flex', alignItems: 'center', gap: 0 }}>
          {STAGE_SEQUENCE.map((stageKey, i) => {
            const info = STAGES[stageKey];
            const done = info.order < stage.order;
            const current = stageKey === order.status;
            const future = info.order > stage.order;
            return (
              <React.Fragment key={stageKey}>
                <div style={{
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4,
                }}>
                  <div style={{
                    width: current ? 14 : 10,
                    height: current ? 14 : 10,
                    borderRadius: '50%',
                    background: done ? info.dot : current ? info.dot : t.surface3,
                    border: current ? `2px solid ${info.dot}` : 'none',

                    transition: 'all 0.2s',

                  }} />
                  <span style={{
                    fontSize: 9, fontWeight: current ? 700 : 500,
                    color: done || current ? info.dot : t.label3,

                </div>
                {i < STAGE_SEQUENCE.length - 1 && (
                  <div style={{

        </div>
      </div>

      <Divider inset={0} />

      {/* Details */}

        <Divider />
        <InfoRow label={s('printer')} value={order.printer || '—'} />

        {order.notes && <><Divider /><InfoRow label={s('notes')} value={order.notes} /></>}
      </div>

      {/* Advance button */}
      {canAdvance && nextStageInfo && (
        <button onClick={() => { onAdvance(order); onClose(); }} style={{
          width: '100%', marginTop: 20,
          padding: '15px 0',
          background: nextStageInfo.dot,
          border: 'none', borderRadius: 14,
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
          cursor: 'pointer',

          <span style={{ fontSize: 16, fontWeight: 700, color: '#fff' }}>

      {order.status === 'completed' && (

          <span style={{ fontSize: 15, fontWeight: 600, color: STAGES.completed.dot }}>{s('orderComplete')}</span>

  );
}

// ─── Orders Screen ────────────────────────────────────────────────────────────

function OrdersScreen({ initialFilter }) {
  const { t, s, lang } = useTheme();
  const { orders, advanceOrder } = useApp();
  const [tab, setTab] = useState('active');
  const [filter, setFilter] = useState(initialFilter || 'all');
  const [detailOrder, setDetailOrder] = useState(null);
  const [sheetOpen, setSheetOpen] = useState(false);

  const openDetail = (order) => { setDetailOrder(order); setSheetOpen(true); };
  const closeDetail = () => setSheetOpen(false);

  const activeOrders = orders.filter(o => o.status !== 'completed');
  const recentOrders = orders.filter(o => o.status === 'completed');

  const stageLabel = (id) => (lang === 'ar' && typeof STAGE_LABELS_AR !== 'undefined') ? STAGE_LABELS_AR[id] : STAGES[id].label;
  const filterOpts = [
    { id: 'all',      label: s('f_all'),         count: activeOrders.length },
    { id: 'pending',  label: stageLabel('pending'),  count: activeOrders.filter(o => o.status === 'pending').length },
    { id: 'printing', label: stageLabel('printing'), count: activeOrders.filter(o => o.status === 'printing').length },
    { id: 'post',     label: stageLabel('post'),     count: activeOrders.filter(o => o.status === 'post').length },
    { id: 'qc',       label: stageLabel('qc'),       count: activeOrders.filter(o => o.status === 'qc').length },
  ];

  const displayed = tab === 'active'
    ? (filter === 'all' ? activeOrders : activeOrders.filter(o => o.status === filter))
    : recentOrders;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', position: 'relative' }}>
      {/* Nav */}
      <LargeNavBar
        title={s('tab_orders')}
        right={<span style={{ fontSize: 22, fontWeight: 300, lineHeight: 1 }}>+</span>}
      />

      {/* Segmented control */}
      <div style={{
        display: 'flex', padding: '8px 16px',
        background: t.navBg, backdropFilter: 'blur(20px)',
        WebkitBackdropFilter: 'blur(20px)',
        flexShrink: 0, gap: 0,
      }}>
        {[{ id: 'active', label: s('active') }, { id: 'recent', label: s('history') }].map(seg => (
          <button key={seg.id} onClick={() => setTab(seg.id)} style={{
            flex: 1, padding: '7px 0',
            background: tab === seg.id ? t.brand : t.surface2,
            color: tab === seg.id ? '#fff' : t.label2,
            border: 'none', cursor: 'pointer',
            fontSize: 14, fontWeight: 600,
            borderRadius: seg.id === 'active' ? '10px 0 0 10px' : '0 10px 10px 0',
            transition: 'all 0.18s ease',
          }}>{seg.label}</button>
        ))}
      </div>

      {/* Filter chips — active only */}
      {tab === 'active' && (
        <div style={{
          background: t.navBg,
          backdropFilter: 'blur(20px)',
          WebkitBackdropFilter: 'blur(20px)',
          flexShrink: 0,
          borderBottom: `0.5px solid ${t.sep}`,
        }}>
          <FilterChips options={filterOpts} active={filter} onChange={setFilter} />
        </div>
      )}

      {/* List */}
      <ScrollView>
        {displayed.length === 0 ? (
          <EmptyState
            icon={tab === 'active' ? '📋' : '📦'}
            title={tab === 'active' ? s('queueClear') : s('noCompleted')}
            subtitle={tab === 'active' ? s('allCaughtUp') : s('completedAppear')}
          />
        ) : (
          <div style={{ paddingTop: 8 }}>
            <div style={{ background: t.surface, borderRadius: 16, margin: '0 16px', overflow: 'hidden' }}>
              {displayed.map((order, i) =>
                tab === 'active' ? (
                  <OrderRow
                    key={order.id}
                    order={order}
                    onTap={openDetail}
                    onAdvance={advanceOrder}
                    isLast={i === displayed.length - 1}
                  />
                ) : (
                  <RecentRow key={order.id} order={order} isLast={i === displayed.length - 1} />
                )
              )}
            </div>
            <div style={{ height: 24 }} />
          </div>
        )}
      </ScrollView>

      {/* Detail Sheet */}
      <BottomSheet
        visible={sheetOpen}
        onDismiss={closeDetail}
        title={detailOrder?.id}
      >
        <OrderDetailContent
          order={detailOrder}
          onAdvance={advanceOrder}
          onClose={closeDetail}
        />
      </BottomSheet>
    </div>
  );
}

Object.assign(window, { OrdersScreen });

function InventoryScreen() {
  const { t, s } = useTheme();
  const { spools, addSpool } = useApp();
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('all');
  const [detailSpool, setDetailSpool] = useState(null);
  const [addOpen, setAddOpen] = useState(false);

  const filtered = spools.filter(sp => {
    const matchSearch = !search || `${sp.brand} ${sp.material} ${sp.color} ${sp.sku}`.toLowerCase().includes(search.toLowerCase());
    const matchFilter = filter === 'all' || (filter === 'low' && sp.lowStock);
    return matchSearch && matchFilter;
  });

  if (detailSpool) {
    return <SpoolDetailScreen spool={detailSpool} onBack={() => setDetailSpool(null)} />;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', position: 'relative' }}>
      {/* Nav */}
      <LargeNavBar
        title={s('tab_inventory')}
        right={<span style={{ fontSize: 22, fontWeight: 300, lineHeight: 1 }}>+</span>}
        onRight={() => setAddOpen(true)}
      />

      {/* Search + filters */}
      <div style={{
        flexShrink: 0, padding: '8px 16px',
        background: t.navBg, backdropFilter: 'blur(20px)',
        WebkitBackdropFilter: 'blur(20px)',
        borderBottom: `0.5px solid ${t.sep}`,
      }}>
        <div style={{
          display: 'flex', alignItems: 'center', gap: 10,
          background: t.surface2, borderRadius: 12,
          padding: '9px 14px', marginBottom: 8,
        }}>
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
            <circle cx="6.5" cy="6.5" r="5" stroke={t.label3} strokeWidth="1.6"/>
            <path d="M10 10l3.5 3.5" stroke={t.label3} strokeWidth="1.6" strokeLinecap="round"/>
          </svg>
          <input
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder={s('searchPlaceholder')}
            style={{
              flex: 1, background: 'none', border: 'none', outline: 'none',
              fontSize: 15, color: t.label,
            }}
          />
          {search && (
            <button onClick={() => setSearch('')} style={{ background: 'none', border: 'none', cursor: 'pointer', color: t.label3, fontSize: 16 }}>✕</button>
          )}
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          {[
            { id: 'all', label: `${s('f_all')} (${spools.length})` },
            { id: 'low', label: `${s('lowStockFilter')} (${spools.filter(sp => sp.lowStock).length})` },
          ].map(opt => (
            <button key={opt.id} onClick={() => setFilter(opt.id)} style={{
              padding: '5px 12px', borderRadius: 100,
              background: filter === opt.id ? t.brandDim : t.surface2,
              border: `1.5px solid ${filter === opt.id ? t.brand + '50' : t.sep}`,
              color: filter === opt.id ? t.brand : t.label2,
              fontSize: 12, fontWeight: 600, cursor: 'pointer',
              transition: 'all 0.18s',
            }}>{opt.label}</button>
          ))}
        </div>
      </div>

      {/* List */}
      <ScrollView>
        {filtered.length === 0 ? (
          <EmptyState
            icon="📦"
            title={search ? s('noResults') : s('noSpoolsYet')}
            subtitle={search ? s('tryDiffSearch') : s('addFirstSpool')}
            action={!search ? s('addSpool') : undefined}
            onAction={() => setAddOpen(true)}
          />
        ) : (
          <div style={{ paddingTop: 10 }}>
            <div style={{ background: t.surface, borderRadius: 16, margin: '0 16px', overflow: 'hidden' }}>
              {filtered.map((spool, i) => (
                <SpoolRow
                  key={spool.id}
                  spool={spool}
                  onTap={setDetailSpool}
                  isLast={i === filtered.length - 1}
                />
              ))}
            </div>
            <div style={{ height: 24 }} />
          </div>
        )}
      </ScrollView>

      {/* Add spool sheet */}
      <AddSpoolSheet visible={addOpen} onDismiss={() => setAddOpen(false)} onAdd={addSpool} />
    </div>
  );
}

function MachinesSummary({ machines }) {
  const { t, s } = useTheme();
  const printing = machines.filter(m => m.status === 'printing').length;

// ─── Machines Screen ──────────────────────────────────────────────────────────

function MachinesScreen() {
  const { t, s } = useTheme();
  const { machines } = useApp();

  // Sort: errors first, then printing, then idle, then offline
  const sorted = [...machines].sort((a, b) => {
    const order = { error: 0, printing: 1, idle: 2, offline: 3 };
    return (order[a.status] ?? 4) - (order[b.status] ?? 4);
  });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      <LargeNavBar title={s('tab_machines')} />

      <ScrollView>
        {/* Summary */}
        <MachinesSummary machines={machines} />

        {/* Machine list */}
        <div style={{ marginTop: 16 }}>
          <SectionLabel text={`${machines.length} ${s('printersCount')}`} />
          <div style={{ background: t.surface, borderRadius: 16, margin: '0 16px', overflow: 'hidden' }}>
            {sorted.map((machine, i) => (
              <React.Fragment key={machine.id}>
                <MachineCard machine={machine} />
                {i < sorted.length - 1 && <Divider inset={76} />}
              </React.Fragment>
            ))}
          </div>
        </div>

        <div style={{ height: 24 }} />
      </ScrollView>
    </div>
  );
}

// ─── Pairing Wizard ────────────────────────────────────────────────────────────

function PairingWizard({ onComplete, onSkip }) {
  const { t, dark } = useTheme();
  const { updateSettings, setConnected } = useApp();
  const [step, setStep] = useState(0);
  const [host, setHost] = useState('192.168.1.');
  const [port, setPort] = useState('8765');
  const [pin, setPin] = useState(['', '', '', '']);
  const [testing, setTesting] = useState(false);
  const [testOk, setTestOk] = useState(null);

  const pinRefs = [React.useRef(), React.useRef(), React.useRef(), React.useRef()];

  const setDigit = (i, val) => {
    if (!/^\d?$/.test(val)) return;
    const next = [...pin];
    next[i] = val;
    setPin(next);
    if (val && i < 3) pinRefs[i + 1].current?.focus();
  };

  const testConn = () => {
    setTesting(true);
    setTimeout(() => { setTesting(false); setTestOk(true); }, 1600);
  };

  const steps = [
    // Step 0: Welcome
    {
      title: 'Connect to\nKhayt Desktop',
      content: (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20, padding: '20px 0 0' }}>
          {/* Khayt logo mark */}
          <div style={{
            width: 100, height: 100, borderRadius: 28,
            background: `linear-gradient(135deg, ${t.brand}30 0%, ${t.brand}10 100%)`,
            border: `2px solid ${t.brand}30`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
              <path d="M12 28L28 12L44 28" stroke={t.brand} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
              <path d="M20 44V28h16v16" stroke={t.brand} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/>
              <rect x="22" y="36" width="12" height="8" rx="2" fill={t.brandDim}/>
            </svg>
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 15, color: t.label2, lineHeight: 1.6 }}>
              Khayt Companion connects over your <strong style={{ color: t.label }}>local Wi-Fi</strong> to the Khayt desktop app.
            </div>
            <div style={{ marginTop: 12, fontSize: 13, color: t.label3, lineHeight: 1.5 }}>
              No cloud. No account. Shop data stays on your network.
            </div>
          </div>
          <div style={{
            background: t.surface2, borderRadius: 14,
            padding: '12px 16px', width: '100%', display: 'flex', flexDirection: 'column', gap: 8,
          }}>
            {[
              'Khayt desktop app is running',
              'Phone is on the same Wi-Fi',
              'LAN PIN is ready on desktop',
            ].map((item, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{ width: 20, height: 20, borderRadius: 10, background: t.brandDim, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
                  <span style={{ fontSize: 11, color: t.brand, fontWeight: 700 }}>{i + 1}</span>
                </div>
                <span style={{ fontSize: 13, color: t.label2 }}>{item}</span>
              </div>
            ))}
          </div>
        </div>
      ),
      cta: "Let's go →",
    },
    // Step 1: IP + Port
    {
      title: 'Desktop\nAddress',
      content: (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14, paddingTop: 8 }}>
          <div style={{ fontSize: 14, color: t.label2, lineHeight: 1.5 }}>
            On the Khayt desktop app, open <strong style={{ color: t.label }}>Settings → Mobile</strong> to find your IP address.
          </div>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: t.label2, letterSpacing: 0.5, marginBottom: 6, textTransform: 'uppercase' }}>Desktop IP Address</div>
            <input
              value={host}
              onChange={e => setHost(e.target.value)}
              placeholder="192.168.1.100"
              style={{
                width: '100%', padding: '13px 14px',
                background: t.surface2, border: `1.5px solid ${t.sep}`,
                borderRadius: 12, fontSize: 17, color: t.label,
                outline: 'none', boxSizing: 'border-box',
                fontVariantNumeric: 'tabular-nums', letterSpacing: 0.5,
              }}
            />
          </div>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: t.label2, letterSpacing: 0.5, marginBottom: 6, textTransform: 'uppercase' }}>Port</div>
            <input
              value={port}
              onChange={e => setPort(e.target.value)}
              placeholder="8765"
              style={{
                width: '100%', padding: '13px 14px',
                background: t.surface2, border: `1.5px solid ${t.sep}`,
                borderRadius: 12, fontSize: 17, color: t.label,
                outline: 'none', boxSizing: 'border-box',
              }}
            />
            <div style={{ fontSize: 12, color: t.label3, marginTop: 5 }}>Default port is 8765</div>
          </div>
        </div>
      ),
      cta: 'Next: Enter PIN →',
    },
    // Step 2: PIN
    {
      title: 'Enter\nLAN PIN',
      content: (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16, alignItems: 'center', paddingTop: 8 }}>
          <div style={{ fontSize: 14, color: t.label2, lineHeight: 1.5, alignSelf: 'stretch' }}>
            Open <strong style={{ color: t.label }}>Khayt desktop → Settings → Mobile</strong> and tap <em>Show PIN</em>.
          </div>
          <div style={{ display: 'flex', gap: 12 }}>
            {pin.map((d, i) => (
              <input
                key={i}
                ref={pinRefs[i]}
                maxLength={1}
                inputMode="numeric"
                value={d}
                onChange={e => setDigit(i, e.target.value)}
                onKeyDown={e => {
                  if (e.key === 'Backspace' && !d && i > 0) pinRefs[i - 1].current?.focus();
                }}
                style={{
                  width: 60, height: 68, textAlign: 'center',
                  fontSize: 28, fontWeight: 700, letterSpacing: 0,
                  background: t.surface2,
                  border: `2px solid ${d ? t.brand + '80' : t.sep}`,
                  borderRadius: 14, color: t.label,
                  outline: 'none',
                  transition: 'border-color 0.2s',
                }}
              />
            ))}
          </div>
          <div style={{ fontSize: 13, color: t.label3 }}>PIN is stored securely in Keychain</div>
        </div>
      ),
      cta: 'Test Connection →',
    },
    // Step 3: Test
    {
      title: 'All set!',
      content: (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20, paddingTop: 16 }}>
          <div style={{
            width: 80, height: 80, borderRadius: '50%',
            background: testOk ? t.successDim : t.brandDim,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 36,
            transition: 'background 0.3s',
          }}>
            {testing ? (
              <div style={{ width: 32, height: 32, borderRadius: '50%', border: `3px solid ${t.brand}`, borderTopColor: 'transparent', animation: 'khayt-spin 0.8s linear infinite' }} />
            ) : testOk ? '✓' : '📡'}
          </div>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontSize: 17, fontWeight: 600, color: t.label, marginBottom: 6 }}>
              {testing ? 'Connecting…' : testOk ? 'Connected!' : 'Ready to connect'}
            </div>
            <div style={{ fontSize: 14, color: t.label2, lineHeight: 1.5 }}>
              {testOk ? `Paired with Khayt Desktop at ${host}:${port}` : 'Tap the button below to test your connection'}
            </div>
          </div>
          {!testOk && !testing && (
            <button onClick={testConn} style={{
              padding: '12px 28px', borderRadius: 14,
              background: t.brandDim, border: `1.5px solid ${t.brand}40`,
              color: t.brand, fontSize: 14, fontWeight: 600, cursor: 'pointer',
            }}>Test Connection</button>
          )}
        </div>
      ),
      cta: testOk ? 'Open Khayt Companion' : 'Skip for now',
    },
  ];

  const currentStep = steps[step];

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 300,
      background: dark ? t.bg : t.bg,
      display: 'flex', flexDirection: 'column',
    }}>
      {/* Header */}
      <div style={{ paddingTop: 62, padding: '62px 16px 0', flexShrink: 0 }}>
        {/* Step dots */}
        <div style={{ display: 'flex', gap: 6, marginBottom: 24 }}>
          {steps.map((_, i) => (
            <div key={i} style={{
              height: 4, flex: i <= step ? 2 : 1,
              borderRadius: 2,
              background: i <= step ? t.brand : t.surface3,
              transition: 'all 0.3s ease',
            }} />
          ))}
        </div>
        {/* Title */}
        <div style={{
          fontSize: 30, fontWeight: 700, color: t.label,
          letterSpacing: -0.5, lineHeight: 1.2,
          whiteSpace: 'pre-line',
          marginBottom: 20,
        }}>{currentStep.title}</div>
      </div>

      {/* Content */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '0 16px', paddingBottom: 16 }}>
        {currentStep.content}
      </div>

      {/* CTA */}
      <div style={{ padding: '12px 16px 32px', flexShrink: 0 }}>
        <button onClick={() => {
          if (step < steps.length - 1) {
            setStep(s => s + 1);
          } else {
            updateSettings({ host, port, pin: pin.join('') });
            if (testOk) setConnected(true);
            onComplete();
          }
        }} style={{
          width: '100%', padding: '16px',
          background: t.brand, border: 'none',
          borderRadius: 16, fontSize: 16, fontWeight: 700,
          color: '#fff', cursor: 'pointer',
          boxShadow: `0 4px 20px ${t.brand}40`,
        }}>{currentStep.cta}</button>
        {step > 0 && (
          <button onClick={() => setStep(s => s - 1)} style={{
            width: '100%', marginTop: 10, padding: '12px',
            background: 'none', border: 'none',
            fontSize: 15, color: t.label2, cursor: 'pointer',
          }}>← Back</button>
        )}
        {step === 0 && onSkip && (
          <button onClick={onSkip} style={{
            width: '100%', marginTop: 10, padding: '12px',
            background: 'none', border: 'none',
            fontSize: 15, color: t.label2, cursor: 'pointer',
          }}>Skip setup</button>
        )}
      </div>
    </div>
  );
}

          <SmallWidget counts={counts} connected={connected} s={s} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {[['#8183FF', true], ['#32D74B', false], ['#FF9F0A', false]].map(([c, mark], i) => (
              <div key={i} style={{
                width: 62, height: 62, borderRadius: 15,
                background: `linear-gradient(160deg, ${c}40, ${c}15)`,
                border: '1px solid rgba(255,255,255,0.08)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                opacity: 0.5,
              }}>
                {mark && <KhaytMark size={26} color="rgba(255,255,255,0.5)" />}
              </div>
            ))}
          </div>
        </div>

        {/* Medium widget */}
        <MediumWidget counts={counts} connected={connected} s={s} printingOrder={printingOrder} />

        {/* Caption */}
        <div style={{
          fontSize: 12, color: 'rgba(255,255,255,0.5)', textAlign: 'center',
          maxWidth: 280, lineHeight: 1.5, direction: rtl ? 'rtl' : 'ltr',
        }}>
          {rtl
            ? 'تحدّث العناصر تلقائياً عبر الشبكة المحلية. النقطة تعرض حالة الاتصال بسطح المكتب.'
            : 'Widgets refresh over LAN. The dot shows live desktop connection — green when paired, red when offline.'}
        </div>
      </div>

      {/* Dock hint */}
      <div style={{ height: 28, flexShrink: 0 }} />
    </div>
  );
}

Object.assign(window, { WidgetPreview });

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": true,
  "connected": true,
  "showPairing": false,
  "lang": "en",
  "accent": "#8183FF"
}/*EDITMODE-END*/;

// ─── Main App ─────────────────────────────────────────────────────────────────

function KhaytApp() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const dark = tweaks.dark;
  const t = dark ? DARK_TOKENS : LIGHT_TOKENS;
  const lang = tweaks.lang || 'en';
  const rtl = lang === 'ar';
  const s = useMemo(() => makeS(lang), [lang]);

  const [orders, setOrders] = useState(INITIAL_ORDERS);
  const [spools, setSpools] = useState(INITIAL_SPOOLS);
  const [machines] = useState(INITIAL_MACHINES);
  const [settings, setSettings] = useState(INITIAL_SETTINGS);
  const [connected, setConnected] = useState(tweaks.connected);
  const [showPairing, setShowPairing] = useState(tweaks.showPairing);

  const [activeTab, setActiveTab] = useState('home');
  const [ordersFilter, setOrdersFilter] = useState(null);
  const [showWidget, setShowWidget] = useState(false);

  // Keep connected in sync with tweak (one-way init)
  const [syncDone, setSyncDone] = useState(false);
  React.useEffect(() => {
    if (!syncDone) { setConnected(tweaks.connected); setShowPairing(tweaks.showPairing); setSyncDone(true); }
  }, [tweaks.connected, tweaks.showPairing]);

  const advanceOrder = useCallback((order) => {
    const idx = STAGE_SEQUENCE.indexOf(order.status);
    if (idx >= STAGE_SEQUENCE.length - 1) return;
    const nextStatus = STAGE_SEQUENCE[idx + 1];
    setOrders(prev => prev.map(o => o.id === order.id
      ? { ...o, status: nextStatus, progress: nextStatus === 'completed' ? 100 : o.progress }
      : o
    ));
  }, []);

  const addSpool = useCallback((spool) => {
    setSpools(prev => [spool, ...prev]);
  }, []);

  const updateSettings = useCallback((patch) => {
    setSettings(prev => ({ ...prev, ...patch }));
  }, []);

  const appValue = useMemo(() => ({
    orders, spools, machines, settings, connected, setConnected,
    advanceOrder, addSpool, updateSettings,
  }), [orders, spools, machines, settings, connected]);

  const themeValue = useMemo(() => ({ dark, t, lang, rtl, s }), [dark, t, lang, rtl, s]);

  const goToOrders = useCallback((filter) => {
    setOrdersFilter(filter || null);
    setActiveTab('orders');
  }, []);

  const [pendingOrderDetail, setPendingOrderDetail] = useState(null);

  const openOrderDetail = useCallback((order) => {
    setPendingOrderDetail(order);
    setActiveTab('orders');
  }, []);

  const renderScreen = () => {
    switch (activeTab) {
      case 'home':
        return (
          <HomeScreen
            onOrderTap={openOrderDetail}
            onGoToInventory={() => setActiveTab('inventory')}
            onGoToOrders={goToOrders}
          />
        );
      case 'orders':
        return <OrdersScreen initialFilter={ordersFilter} />;
      case 'inventory':
        return <InventoryScreen />;
      case 'machines':
        return <MachinesScreen />;
      case 'settings':
        return <SettingsScreen onShowPairing={() => setShowPairing(true)} />;
      default:
        return null;
    }
  };

  return (
    <ThemeContext.Provider value={themeValue}>
      <AppContext.Provider value={appValue}>
        <div style={{
          minHeight: '100vh',
          background: dark ? '#0A0A0F' : '#D8D8E0',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontFamily: "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif",
          WebkitFontSmoothing: 'antialiased',
          padding: '24px 16px',
        }}>
          <IOSDevice dark={dark} width={393} height={852}>
            <div dir={rtl ? 'rtl' : 'ltr'} style={{
              height: '100%',
              display: 'flex', flexDirection: 'column',
              overflow: 'hidden',
              background: dark ? t.bg : t.bg,
              fontFamily: rtl
                ? "'SF Arabic', 'Geeza Pro', -apple-system, BlinkMacSystemFont, sans-serif"
                : "-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif",
            }}>
              {/* Status bar spacer — the IOSDevice renders status bar absolutely */}
              <div style={{ height: 62, flexShrink: 0 }} />

              {/* Connection banner */}
              {!connected && (
                <ConnectionBanner onRetry={() => {
                  setTimeout(() => setConnected(true), 800);
                }} />
              )}

              {/* Screen content */}
              <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
                {renderScreen()}
                {showPairing && (
                  <PairingWizard
                    onComplete={() => setShowPairing(false)}
                    onSkip={() => setShowPairing(false)}
                  />
                )}
                {showWidget && (
                  <WidgetPreview onClose={() => setShowWidget(false)} />
                )}
              </div>

              {/* Tab bar */}
              <TabBar activeTab={activeTab} onTabChange={(tab) => { setActiveTab(tab); setOrdersFilter(null); }} />
            </div>
          </IOSDevice>

          {/* Tweaks panel */}
          <TweaksPanel>
            <TweakSection label="Appearance" />
            <TweakToggle label="Dark mode" value={dark} onChange={v => setTweak('dark', v)} />
            <TweakRadio label="Language" value={lang}
              options={[{ value: 'en', label: 'English' }, { value: 'ar', label: 'العربية' }]}
              onChange={v => setTweak('lang', v)} />
            <TweakSection label="Connection" />
            <TweakToggle label="Connected to desktop" value={connected} onChange={v => setConnected(v)} />
            <TweakSection label="Flows" />
            <TweakButton label="Show Pairing Wizard" onClick={() => setShowPairing(true)} />
            <TweakButton label="Show Home Widgets" onClick={() => setShowWidget(true)} />
            <TweakButton label="Reset all orders" onClick={() => setOrders(INITIAL_ORDERS)} />
          </TweaksPanel>
        </div>
      </AppContext.Provider>
    </ThemeContext.Provider>
  );
}
