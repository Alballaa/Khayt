<!doctype html>
<html lang="en" dir="ltr" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khayt · Cockpit — Proto B</title>
<style>
/* ============================================================
   KHAYT COCKPIT  ·  Direction B  ·  dense pro command-center
   light default · color-as-information · three-pane app shell
   ============================================================ */
:root{
  --s1:4px;--s2:6px;--s3:8px;--s4:12px;--s5:16px;--s6:24px;
  --r:6px;--r2:8px;--pill:999px;
  --ctl:28px;
  --font:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,system-ui,sans-serif;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono','IBM Plex Mono',Menlo,monospace;

  /* MODULE ACCENT HUES — color codes meaning across the app */
  --m-dash:#2f7fe0;   /* blue   */
  --m-calc:#7c5cff;   /* violet */
  --m-queue:#e0742f;  /* orange */
  --m-fleet:#16a989;  /* teal   */
  --m-inv:#c9942a;    /* amber  */
  --m-clients:#d8425a;/* rose   */
  --m-invoice:#1e9e6c;/* green  */
  --m-analytics:#9b59b6;/*purple*/
  --m-settings:#5a6b7b;/* slate */
}
html[data-mode="light"]{
  --bg:#eef1f6; --bg-2:#e6eaf1; --panel:#ffffff; --panel-2:#f5f7fb; --panel-3:#eef1f6;
  --hair:#e1e6ee; --hair-2:#d3dae5; --border:#d7dde7;
  --ink:#16202b; --dim:#56657a; --faint:#8693a6; --ghost:#aab4c4;
  --ok:#1e9e6c; --warn:#cf9012; --danger:#d8425a; --info:#2f7fe0;
  --shadow:0 6px 22px rgba(20,40,70,.10);
  --inset:inset 0 0 0 1px var(--hair);
  --rail:#1d2530; --rail-ink:#aeb9c7;
}
html[data-mode="dark"]{
  --bg:#0e1318; --bg-2:#0a0e12; --panel:#161c24; --panel-2:#1b232d; --panel-3:#11161c;
  --hair:#222c38; --hair-2:#2a3644; --border:#2a3644;
  --ink:#e7edf3; --dim:#9fb0c0; --faint:#6b7c8c; --ghost:#536272;
  --ok:#46c08a; --warn:#f5b53d; --danger:#ef5a6f; --info:#4f9cf0;
  --shadow:0 10px 34px rgba(0,0,0,.45);
  --inset:inset 0 0 0 1px var(--hair);
  --rail:#0a0e12; --rail-ink:#8493a4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:12.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.05px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ghost);background-clip:padding-box}
kbd{font-family:var(--mono);font-size:10px;background:var(--panel-2);border:1px solid var(--hair-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--dim);line-height:1.4}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============ APP SHELL — toolbar / 3-pane / status bar ============ */
.app{display:grid;grid-template-rows:38px 1fr 24px;height:100vh}

/* TOP TOOLBAR + TABS */
.toolbar{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:13px;letter-spacing:.2px}
.brand .mk{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--m-dash),var(--m-fleet));display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.tabs{display:flex;align-items:stretch;height:100%}
.tab{display:flex;align-items:center;gap:6px;padding:0 var(--s4);font-size:12px;color:var(--dim);border-bottom:2px solid transparent;position:relative}
.tab:hover{color:var(--ink);background:var(--panel-2)}
.tab.active{color:var(--ink);border-bottom-color:var(--tab-c,var(--info))}
.tab .x{color:var(--faint);font-size:13px;opacity:0;width:12px}
.tab:hover .x{opacity:1}
.tab.active .x{opacity:.6}
.tbspace{flex:1}
.tb-search{display:flex;align-items:center;gap:var(--s2);height:24px;padding:0 var(--s3);background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r);color:var(--faint);min-width:230px;font-size:11.5px}
.tb-search kbd{margin-inline-start:auto}
.tb-ic{width:26px;height:24px;border-radius:var(--r);color:var(--dim);display:grid;place-items:center;position:relative}
.tb-ic:hover{background:var(--panel-2);color:var(--ink)}
.tb-ic .dot{position:absolute;top:3px;inset-inline-end:4px;width:6px;height:6px;border-radius:50%;background:var(--danger);border:1.5px solid var(--panel)}

/* BODY = rail + nav + work (+ inspector) */
.body{display:grid;grid-template-columns:48px 212px 1fr;min-height:0;overflow:hidden;transition:grid-template-columns .15s}
.body.has-insp{grid-template-columns:48px 212px 1fr 312px}
.body.nav-collapsed{grid-template-columns:48px 0 1fr}
.body.nav-collapsed.has-insp{grid-template-columns:48px 0 1fr 312px}

/* (1) ICON RAIL */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:var(--s3) 0;gap:2px}
.rail-ic{width:34px;height:34px;border-radius:var(--r2);display:grid;place-items:center;color:var(--rail-ink);font-size:16px;position:relative;transition:.12s}
.rail-ic:hover{background:rgba(255,255,255,.07);color:#fff}
.rail-ic.active{color:#fff;background:color-mix(in srgb,var(--rc) 30%,transparent)}
.rail-ic.active::before{content:"";position:absolute;inset-inline-start:-7px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--rc)}
.rail-ic .rb{position:absolute;top:2px;inset-inline-end:2px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--rc);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;border:1.5px solid var(--rail)}
.rail .sp{flex:1}

/* (2) CONTEXT NAV COLUMN */
.nav{background:var(--panel);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.nav-hd{padding:var(--s4) var(--s4) var(--s3);display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--hair)}
.nav-hd .accent{width:9px;height:9px;border-radius:3px;background:var(--ac)}
.nav-scroll{overflow:auto;padding:var(--s2) var(--s3);flex:1}
.nav-grp{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:var(--s4) var(--s3) var(--s1)}
.nav-grp:first-child{padding-top:var(--s2)}
.nitem{display:flex;align-items:center;gap:var(--s3);padding:5px var(--s3);border-radius:var(--r);color:var(--dim);width:100%;text-align:start;font-size:12px;font-weight:500}
.nitem:hover{background:var(--panel-2);color:var(--ink)}
.nitem.active{background:color-mix(in srgb,var(--ai) 14%,transparent);color:var(--ink);font-weight:600}
.nitem.active .ni{color:var(--ai)}
.nitem .ni{width:15px;text-align:center;font-size:13px;color:var(--faint)}
.nitem .nc{margin-inline-start:auto;font-size:10px;color:var(--faint);font-family:var(--mono)}
.nitem .nbadge{margin-inline-start:auto;background:var(--danger);color:#fff;border-radius:var(--pill);font-size:9.5px;font-weight:800;padding:0 5px;min-width:16px;text-align:center}
.nav-ft{border-top:1px solid var(--hair);padding:var(--s3) var(--s4);font-size:10.5px;color:var(--faint);display:flex;align-items:center;gap:6px}

/* (3) WORK AREA */
.work{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--bg)}
.work-bar{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s5);background:var(--panel);border-bottom:1px solid var(--border);min-height:42px}
.work-bar .title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:var(--s3)}
.work-bar .title .mtag{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:var(--ac);padding:2px 6px;border-radius:4px}
.work-bar .sub{font-size:11px;color:var(--faint)}
.spacer{flex:1}
.work-scroll{flex:1;overflow:auto;padding:var(--s5)}

/* (R) RIGHT INSPECTOR */
.insp{background:var(--panel);border-inline-start:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.insp-hd{padding:var(--s4) var(--s5);border-bottom:1px solid var(--hair);display:flex;align-items:flex-start;gap:var(--s3)}
.insp-hd .it{font-weight:700;font-size:13px}
.insp-hd .ix{margin-inline-start:auto;color:var(--faint);font-size:16px;line-height:1}
.insp-hd .ix:hover{color:var(--ink)}
.insp-scroll{overflow:auto;flex:1;padding:var(--s5)}
.insp-sec{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:700;margin:var(--s5) 0 var(--s3)}
.insp-sec:first-child{margin-top:0}
.kv{display:flex;justify-content:space-between;gap:var(--s4);padding:4px 0;border-bottom:1px solid var(--hair);font-size:12px}
.kv:last-child{border:none}
.kv .k{color:var(--dim)}
.kv .v{font-weight:600;text-align:end;font-family:var(--mono)}
.insp-ft{border-top:1px solid var(--hair);padding:var(--s4);display:flex;gap:var(--s2)}

/* STATUS BAR */
.status{display:flex;align-items:center;gap:var(--s5);padding:0 var(--s4);background:var(--rail);color:var(--rail-ink);font-size:10.5px;font-family:var(--mono)}
.status .seg{display:flex;align-items:center;gap:5px}
.status .seg b{color:#fff;font-weight:700}
.status .sp{flex:1}
.status .live{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 5px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ============ PRIMITIVES ============ */
.btn{height:var(--ctl);display:inline-flex;align-items:center;gap:6px;padding:0 var(--s4);border-radius:var(--r);border:1px solid var(--border);background:var(--panel);color:var(--ink);font-weight:600;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--hair-2)}
.btn.sm{height:24px;padding:0 var(--s3);font-size:11.5px}
.btn.xs{height:21px;padding:0 7px;font-size:11px;border-radius:5px}
.btn.primary{background:var(--ac,var(--info));border-color:var(--ac,var(--info));color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.seg-ctl{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;height:var(--ctl)}
.seg-ctl button{padding:0 var(--s3);font-size:11.5px;color:var(--dim);border-inline-end:1px solid var(--border)}
.seg-ctl button:last-child{border:none}
.seg-ctl button.on{background:var(--panel-3);color:var(--ink);font-weight:600}
.inp{height:var(--ctl);border:1px solid var(--border);border-radius:var(--r);background:var(--panel);padding:0 var(--s3);font-size:12px;width:100%}
.inp:focus{outline:none;border-color:var(--ac,var(--info));box-shadow:0 0 0 3px color-mix(in srgb,var(--ac,var(--info)) 16%,transparent)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 var(--s3);border:1px solid var(--border);border-radius:var(--pill);background:var(--panel);color:var(--dim);font-size:11.5px}
.chip:hover{border-color:var(--hair-2);color:var(--ink)}
.chip.on{background:color-mix(in srgb,var(--info) 12%,transparent);border-color:color-mix(in srgb,var(--info) 35%,transparent);color:var(--info);font-weight:600}

/* color tokens used as data */
.dotc{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:var(--pill);display:inline-flex;align-items:center;gap:4px;line-height:1.6}
.b-blue{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.b-green{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-amber{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-red{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.b-violet{background:color-mix(in srgb,var(--m-calc) 14%,transparent);color:var(--m-calc)}
.b-orange{background:color-mix(in srgb,var(--m-queue) 16%,transparent);color:var(--m-queue)}
.b-gray{background:var(--panel-3);color:var(--dim)}

/* ============ DASHBOARD ============ */
.kstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:var(--s5)}
.kpi{background:var(--panel);padding:var(--s4) var(--s5);position:relative}
.kpi::before{content:"";position:absolute;top:0;inset-inline-start:0;width:3px;height:100%;background:var(--kc,var(--info))}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:10.5px;font-weight:700;margin-top:1px}
.up{color:var(--ok)}.down{color:var(--danger)}
.dgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--s5)}
@media(max-width:1180px){.dgrid{grid-template-columns:1fr}.kstrip{grid-template-columns:repeat(3,1fr)}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-bottom:1px solid var(--hair);font-weight:700;font-size:12px}
.panel-hd .ac{width:8px;height:8px;border-radius:3px}
.panel-hd .more{margin-inline-start:auto;color:var(--faint);font-size:11px;font-weight:500}
.panel-body{padding:var(--s4)}
.lrow{display:flex;align-items:center;gap:var(--s3);padding:7px var(--s4);border-bottom:1px solid var(--hair);font-size:12px}
.lrow:last-child{border:none}
.lrow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .sub{color:var(--faint);font-size:11px}
.stack2{display:grid;gap:var(--s5)}

/* mini bar gauge */
.gauge{height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden;flex:1}
.gauge i{display:block;height:100%;background:var(--gc,var(--info))}

/* ============ KANBAN ============ */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:var(--s4);align-items:start}
@media(max-width:1280px){.kanban{grid-template-columns:repeat(3,1fr)}}
.kcol{background:var(--panel-2);border:1px solid var(--border);border-top:3px solid var(--cc);border-radius:var(--r2);display:flex;flex-direction:column;max-height:100%}
.kcol-hd{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--cc)}
.kcol-hd .cnt{margin-inline-start:auto;background:color-mix(in srgb,var(--cc) 16%,transparent);color:var(--cc);border-radius:var(--pill);font-size:10px;padding:0 7px;min-width:18px;text-align:center}
.kcol-body{padding:0 var(--s3) var(--s3);overflow:auto;display:flex;flex-direction:column;gap:var(--s3)}
.kcard{background:var(--panel);border:1px solid var(--border);border-inline-start:3px solid var(--pc,var(--info));border-radius:var(--r);padding:var(--s3);cursor:pointer;transition:.1s}
.kcard:hover{border-color:var(--hair-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.kcard.sel{box-shadow:0 0 0 2px var(--ac,var(--m-queue));border-color:transparent}
.kcard .id{font-family:var(--mono);font-size:10px;color:var(--faint)}
.kcard .t{font-weight:700;font-size:12.5px;margin:2px 0}
.kcard .meta{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-top:6px}
.kcard .due{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
.avatar{width:18px;height:18px;border-radius:50%;background:var(--ac,var(--info));color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;flex:none}

/* ============ TABLES ============ */
.tablewrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;background:var(--panel-2);text-align:start;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:7px var(--s4);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;z-index:2}
thead th:hover{color:var(--ink)}
thead th .sort{opacity:.4;font-size:9px}
tbody td{padding:6px var(--s4);border-bottom:1px solid var(--hair);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
tbody tr.sel{background:color-mix(in srgb,var(--ac,var(--info)) 10%,transparent);box-shadow:inset 3px 0 0 var(--ac,var(--info))}
td.num{text-align:end;font-family:var(--mono);font-variant-numeric:tabular-nums}
.lowrow td:first-child{box-shadow:inset 3px 0 0 var(--danger)}

/* ============ CALCULATOR ============ */
.calc{display:grid;grid-template-columns:1fr 300px;gap:var(--s5);align-items:start}
@media(max-width:1100px){.calc{grid-template-columns:1fr}}
.field{margin-bottom:var(--s4)}
.field label{display:block;font-size:11px;color:var(--dim);font-weight:600;margin-bottom:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.frow3{grid-template-columns:1fr 1fr 1fr}
.price{position:sticky;top:0}
.price .total{font-size:30px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.price .bd{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--hair);font-size:12px}
.price .bd .k{color:var(--dim)}
.price .bd .v{font-family:var(--mono);font-weight:600}
.price .bd.grand{border-top:2px solid var(--hair-2);margin-top:6px;padding-top:8px;font-weight:800}
.cart-item{display:flex;align-items:center;gap:var(--s3);padding:7px 0;border-bottom:1px solid var(--hair);font-size:12px}
.cart-item .sw{width:10px;height:10px;border-radius:3px;flex:none}

/* analytics bars */
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding:var(--s4) 0 24px}
.bar{flex:1;background:linear-gradient(180deg,var(--m-analytics),color-mix(in srgb,var(--m-analytics) 50%,transparent));border-radius:4px 4px 0 0;position:relative;min-width:6px}
.bar:hover{filter:brightness(1.12)}
.bar span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:var(--faint)}
.legend{display:flex;gap:var(--s5);flex-wrap:wrap;font-size:11px;color:var(--dim)}
.legend .li{display:flex;align-items:center;gap:5px}

/* settings */
.set-row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) 0;border-bottom:1px solid var(--hair)}
.set-row .info{flex:1}
.set-row .nm{font-weight:600;font-size:12.5px}
.set-row .ds{font-size:11px;color:var(--faint)}
.toggle{width:36px;height:20px;border-radius:var(--pill);background:var(--hair-2);position:relative;flex:none;transition:.15s}
.toggle.on{background:var(--ok)}
.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on::after{inset-inline-start:18px}
.saved{font-size:10.5px;color:var(--ok);font-weight:600;opacity:0;transition:.2s}
.saved.show{opacity:1}

/* command-K palette */
.pal-bg{position:fixed;inset:0;background:rgba(8,12,18,.45);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding-top:11vh;z-index:50}
.pal-bg.show{display:flex}
.pal{width:560px;max-width:92vw;background:var(--panel);border:1px solid var(--hair-2);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;height:46px;border:none;border-bottom:1px solid var(--hair);padding:0 var(--s5);font-size:14px;background:transparent}
.pal input:focus{outline:none}
.pal-list{max-height:340px;overflow:auto;padding:var(--s2)}
.pal-grp{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:700;padding:var(--s3) var(--s4) var(--s1)}
.pal-it{display:flex;align-items:center;gap:var(--s3);padding:7px var(--s4);border-radius:var(--r);font-size:12.5px}
.pal-it .pi{width:16px;text-align:center}
.pal-it .pk{margin-inline-start:auto;font-size:10px;color:var(--faint)}
.pal-it.on,.pal-it:hover{background:color-mix(in srgb,var(--info) 12%,transparent)}
.pal-ft{display:flex;gap:var(--s4);padding:7px var(--s5);border-top:1px solid var(--hair);font-size:10.5px;color:var(--faint)}

.hidden{display:none!important}
.empty{display:grid;place-items:center;gap:var(--s3);padding:48px;color:var(--faint);text-align:center}
.empty .big{font-size:30px;opacity:.5}

function fmt(n){return 'SAR '+n.toLocaleString('en-US',{maximumFractionDigits:0})}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild}

/* ---- RAIL ---- */
function renderRail(){
  const r=document.getElementById('rail');r.innerHTML='';
  MODULES.forEach(m=>{
    const b=el(`<button class="rail-ic ${m.id===state.module?'active':''}" title="${m.label}" style="--rc:var(${m.c})">${m.icon}${m.badge?`<span class="rb">${m.badge}</span>`:''}</button>`);
    b.onclick=()=>go(m.id);
    r.appendChild(b);
  });
  r.appendChild(el('<div class="sp"></div>'));
  const help=el('<button class="rail-ic" title="Help · ⌘K" style="--rc:var(--info)">?</button>');
  help.onclick=openPal;r.appendChild(help);
}

/* ---- TABS ---- */
const openTabs=['dashboard','queue','inventory'];
function renderTabs(){
  if(!openTabs.includes(state.module))openTabs.push(state.module);
  const t=document.getElementById('tabs');t.innerHTML='';
  openTabs.forEach(id=>{
    const m=MODULES.find(x=>x.id===id);
    const tab=el(`<button class="tab ${id===state.module?'active':''}" style="--tab-c:var(${m.c})">${m.icon} ${m.label}<span class="x">×</span></button>`);
    tab.onclick=(e)=>{if(e.target.classList.contains('x')){closeTab(id);e.stopPropagation();}else go(id);};
    t.appendChild(tab);
  });
}
function closeTab(id){const i=openTabs.indexOf(id);if(openTabs.length<=1)return;openTabs.splice(i,1);if(state.module===id)go(openTabs[Math.max(0,i-1)]);else renderTabs();}

/* ---- NAV ---- */
function renderNav(){
  const n=NAVS[state.module];
  document.getElementById('navTitle').textContent=n.title;
  document.getElementById('navAccent').style.setProperty('--ac',`var(${n.accent})`);
  const list=document.getElementById('navList');list.innerHTML='';
  list.style.setProperty('--ai',`var(${n.accent})`);
  n.items.forEach(it=>{
    if(it.g){list.appendChild(el(`<div class="nav-grp">${it.g}</div>`));return;}
    const right=it.n?`<span class="nbadge">${it.n}</span>`:(it.k!==''&&it.k!=null?`<span class="nc">${it.k}</span>`:'');
    list.appendChild(el(`<button class="nitem ${it.active?'active':''}"><span class="ni">${it.i}</span><span>${it.l}</span>${right}</button>`));
  });
}

/* ---- INSPECTOR ---- */
function renderInspector(){
  const body=document.getElementById('body');
  const insp=document.getElementById('insp');
  if(!state.inspector){body.classList.remove('has-insp');insp.innerHTML='';return;}
  body.classList.add('has-insp');
  insp.innerHTML='';insp.appendChild(state.inspector());
}
function closeInspector(){state.inspector=null;state._sel=null;render();}

function inspPrinter(p){

/* ============================================================
   INTERACTIONS
   ============================================================ */
function openOrder(o){state._sel=o.id;state.inspector=inspOrder(o);render();}
function openSpool(it){state._sel=it.sku;state.inspector=inspSpool(it);render();}
function openPrinter(p){state._sel=p.name;state.inspector=inspPrinter(p);render();}

function go(id){state.module=id;state.inspector=null;state._sel=null;render();}

function render(){
  renderRail();renderTabs();renderNav();
  (SCREENS[state.module]||SCREENS.dashboard)();
  renderInspector();
  document.getElementById('body').classList.toggle('nav-collapsed',state.navCollapsed);
}

/* theme */
function toggleMode(){
  const h=document.querySelector('html');
  h.dataset.mode=h.dataset.mode==='light'?'dark':'light';
  document.getElementById('modeIcon').textContent=h.dataset.mode==='light'?'🌙':'☀';
  syncDarkToggle();
}
function syncDarkToggle(){const t=document.getElementById('setDark');if(t)t.classList.toggle('on',document.querySelector('html').dataset.mode==='dark');}
function autoSave(){const m=document.getElementById('savedMsg');if(!m)return;m.classList.add('show');clearTimeout(window._sv);window._sv=setTimeout(()=>m.classList.remove('show'),1400);}

/* command-K palette */
const PAL=[
  {g:'Go to',items:MODULES.map(m=>({i:m.icon,l:'Open '+m.label,k:'',act:()=>go(m.id)}))},
  {g:'Create',items:[
    {i:'∑',l:'New quote',k:'⌘N',act:()=>go('calculator')},
    {i:'▦',l:'New order',k:'',act:()=>go('queue')},
    {i:'▣',l:'Add spool',k:'',act:()=>go('inventory')},
    {i:'☺',l:'Add client',k:'',act:()=>go('clients')},
    {i:'❖',l:'New invoice',k:'',act:()=>go('invoices')},
  ]},
  {g:'Toggle',items:[
    {i:'🌓',l:'Toggle dark / light',k:'⇧D',act:()=>toggleMode()},
    {i:'☰',l:'Toggle nav column',k:'⌘B',act:()=>{state.navCollapsed=!state.navCollapsed;render();}},
  ]},
];
let palSel=0,palFlat=[];
function openPal(){document.getElementById('palBg').classList.add('show');const i=document.getElementById('palInput');i.value='';palSel=0;renderPal();setTimeout(()=>i.focus(),20);}
function closePal(){document.getElementById('palBg').classList.remove('show');}
function renderPal(){
  const q=(document.getElementById('palInput').value||'').toLowerCase();
  const list=document.getElementById('palList');list.innerHTML='';palFlat=[];
  PAL.forEach(grp=>{
    const matches=grp.items.filter(it=>it.l.toLowerCase().includes(q));
    if(!matches.length)return;
    list.appendChild(el(`<div class="pal-grp">${grp.g}</div>`));
    matches.forEach(it=>{
      const idx=palFlat.length;palFlat.push(it);
      const row=el(`<div class="pal-it ${idx===palSel?'on':''}"><span class="pi">${it.i}</span><span>${it.l}</span>${it.k?`<kbd class="pk">${it.k}</kbd>`:''}</div>`);
      row.onclick=()=>{it.act();closePal();};
      list.appendChild(row);
    });
  });
  if(palSel>=palFlat.length)palSel=0;
}
function palKey(e){
  if(e.key==='Escape')return closePal();
  if(e.key==='ArrowDown'){palSel=Math.min(palSel+1,palFlat.length-1);renderPal();e.preventDefault();}
  if(e.key==='ArrowUp'){palSel=Math.max(palSel-1,0);renderPal();e.preventDefault();}
  if(e.key==='Enter'){if(palFlat[palSel]){palFlat[palSel].act();closePal();}}
}

/* global shortcuts */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();}
  else if(e.shiftKey&&e.key.toLowerCase()==='d'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){toggleMode();}
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='b'){e.preventDefault();state.navCollapsed=!state.navCollapsed;render();}
  else if(e.key==='Escape'&&state.inspector){closeInspector();}
});

/* live clock */
function tick(){const d=new Date();document.getElementById('stClock').textContent=d.toLocaleTimeString('en-GB');}
setInterval(tick,1000);tick();

/* boot */
render();
</script>
